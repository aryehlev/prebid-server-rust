[workspace]
resolver = "3"
# Workspace membership is owned by the orchestrator. Work units never edit this file;
# a unit that needs a new crate or a workspace-level change reports it instead.
members = [
    "crates/bidder-params",
    "crates/config",
    "crates/currency",
    "crates/devtools",
    "crates/differences",
    "crates/errortypes",
    "crates/freecache",
    "crates/gocompat",
    "crates/gogzip",
    "crates/gojson",
    "crates/gojson-derive",
    "crates/gpp",
    "crates/http-client",
    "crates/jsonutil",
    "crates/logger",
    "crates/metrics",
    "crates/openrtb",
    "crates/openrtb-ext",
    "crates/parity",
    "crates/router",
    "crates/server",
    "crates/tcf2",
    "crates/util",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/aryehlev/prebid-server-rust"
readme = "README.md"
keywords = ["prebid", "openrtb", "header-bidding", "adtech"]
categories = ["web-programming::http-server"]
publish = false

# The single source of dependency versions. Every crate names its dependencies with
# `workspace = true` (adding features or `optional` only), so each crate has one version and one
# base feature set. Entries join only when every gate passes with them: one version per package
# in Cargo.lock and in `cargo tree` (R1 check 10, which counts one version that two dependency
# paths resolve with different features as one; clippy::multiple_crate_versions; cargo deny's
# multiple-versions), deny.toml's licences and advisories with no exception, proc macros on syn 3
# only, and offline builds. An entry stays in this table only while a member uses it, because
# cargo warns about one that no member uses (R1 check 17); the stack's entries that wait for their
# first user are commented out at the end of the table.
[workspace.dependencies]
# Dev-only: the key pairs rcgen signs test certificates with.
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["alloc", "aws-lc-sys"] }
axum = { version = "0.8.9", features = ["http2"] }
base64 = "0.23.1"
bytes = "1.12.1"
# JSON and TOML (D-VIPERFMT: the toml feature reads pbs.toml with the toml 1.2.1 already locked).
# The yaml feature pulls yaml-rust2 -> hashlink -> hashbrown 0.16 beside indexmap's 0.17, so YAML
# goes through a serde-saphyr Format instead; the ini feature pulls rust-ini with getrandom 0.2 and
# hashbrown 0.14, so pbs.ini fails startup like viper's other formats (config.formats).
config = { version = "0.15.27", default-features = false, features = ["json", "toml"] }
# No features: Go writes and reads cookie values raw, and percent-encode's encoded() would turn
# the base64 padding of the uids value into %3D.
cookie = "0.18.3"
# Every gzip the server writes (the user's ruling 10 (b), D-FASTGZIP): pbs-server's response
# compression, one compressor per kind of payload per worker thread. Pure Rust; its one dependency, crc32fast,
# is already locked through flate2.
fastgzip = "0.2.0"
flate2 = "1.1.11"
futures-util = "0.3.34"
# glog's nine flags in Go's flag syntax (LOGGING). The default unicode feature resolves to the
# unicode-width 0.2.3 that serde-saphyr's annotate-snippets already locks.
getopts = "0.2.24"
# The ads.cert remote signer's unary gRPC client (D-GRPC: tonic fails the gates), and the bidder
# client's HTTP/2 errors and h2 test servers (HTTP-H2). hyper and reqwest already lock it.
h2 = "0.4.20"
# pbs-server's HTTP/1.1-only connection builder (Go's header limit and read budget, which
# axum::serve does not set) and the loopback test servers; axum already locks it.
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio"] }
# The InfluxDB reporter's line protocol and writes (D-INFLUX), over a reqwest client of its own.
influxdb = { version = "0.8.0", default-features = false, features = ["rustls"] }
ipnet = "2.12.2"
# RFC 7386 merge only (JSONUTIL). The diff feature pulls treediff; 0.3.0 through 4.1.0 need
# thiserror 1, on syn 2.
json-patch = { version = "0.2.7", default-features = false }
log = "0.4.35"
moka = { version = "0.12.16", features = ["sync"] }
# The sets of Go's url.QueryEscape and url.PathEscape (UTIL-CRATES, pbs_util::urlutil: the plan's
# "percent-encoding sets" for net/url). url and axum already lock it.
percent-encoding = "2.3.2"
proc-macro2 = "1.0.107"
# No protobuf: the default feature pulls protobuf 3.7 -> thiserror 1 (syn 2) beside thiserror 2.
prometheus = { version = "0.14.0", default-features = false }
psl = "2.1.257"
quote = "1.0.47"
rand = "0.10.4"
# Dev-only: test certificates. rcgen's own aws_lc_rs feature names `x509-parser?/verify-aws`,
# which puts x509-parser and untrusted 0.7.1 beside 0.9.0 into `cargo metadata`, so rcgen has no
# crypto feature and signs through an aws-lc-rs key.
rcgen = { version = "0.14.10", default-features = false }
regex = "1.13.2"
# No system-proxy (core-foundation 0.9 through system-configuration, beside 0.10): Go reads only
# the proxy environment variables. No charset. reqwest's gzip feature pins tower-http to 0.6.
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "http2", "json", "rustls"] }
# pbs-http-client reads certificates_file roots with rustls (RootCertStore's trust-anchor parse
# and CertificateDer) before reqwest, which configures its own rustls with tls12, takes them;
# rustls also serves the TLS test servers.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.2.0", default-features = false, features = ["deserialize", "serialize"] }
# float_roundtrip: decimal numbers parse to the f64 Go's strconv.ParseFloat gives (without it
# serde_json may be one ulp off). Never enable preserve_order or arbitrary_precision anywhere:
# Go sorts map keys, and arbitrary_precision changes what a Value number is.
serde_json = { version = "1.0.154", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.11.1"
syn = "3.0.10"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
# The differences ledger's fragments (crates/<crate>/differences.toml), which pbs-differences
# reads. Reading into serde types needs only parse, serde and std; a crate that writes TOML adds
# display.
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
# 0.6, not 0.7: reqwest 0.13.5's gzip feature depends on tower-http 0.6. fs is ServeDir for
# /static, as docs/DECISIONS.md accepts it (server.static-files).
tower-http = { version = "0.6.11", features = ["cors", "fs", "limit", "timeout"] }
# No attributes feature: tracing-attributes is on syn 2.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# One log file (D-LOGFILE); glog's per-severity files are ledgered.
tracing-appender = { version = "0.2.5", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4"] }

# Stack entries that no member uses yet (orchestrator ruling 6). Each waits here as its exact
# lines and comments, every line behind one more "# ". The first unit that uses an entry moves it
# up into the table unchanged (the "# " removed, version and features as written, in name order);
# CLEANUP and FINAL-LINT remove an entry that loses its last user. The crates docs/DECISIONS.md
# accepts (its accepted list) wait here the same way.
#
# # Shared state a background task replaces while requests read it (currency rates, vendor lists,
# # stored data).
# arc-swap = "1.9.5"
# # The build dependency of the 51Degrees FFI crate; aws-lc-sys already locks it.
# cc = "1.11.2"
# # Dev-only: COW's benches. Cargo.lock must keep half at 2.6.0: half 2.7.1 depends on zerocopy,
# # whose zerocopy-derive is on syn 2.
# criterion = { version = "0.8.2", default-features = false }
# # ads.cert's TXT discovery (D-DNS). No system-config: it pulls core-foundation 0.9 beside 0.10.
# hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio"] }
# hmac = "0.13.0"
# # golang-lru's simplelru (FETCHER). No default features: they pull foldhash, licensed Zlib.
# lru = { version = "0.19.0", default-features = false }
# md-5 = "0.11.0"
# # Multipart bodies for FormValue at /optout (USERSYNC-PBS).
# multer = { version = "3.1.0", default-features = false }
# # The ads.cert messages, implemented by hand: prost-derive is on syn 2.
# prost = { version = "0.14.6", default-features = false, features = ["std"] }
# # The VAST tokenizer (D-XML). The injector writes Go's encoder output itself (Rule B (d)).
# quick-xml = { version = "0.42.0", default-features = false }
# # Reads /etc/resolv.conf, the file Go's resolver reads, for hickory-resolver (D-DNS).
# resolv-conf = "0.7.6"
# semver = "1.0.28"
# # adapterstest's diff text (ADP-HARNESS).
# similar = { version = "3.2.1", default-features = false, features = ["text"] }
# # Error types (pbs-errortypes and each crate's own); prometheus and quinn already lock it.
# thiserror = "2.0.21"

# Lint policy. Every crate opts in with `[lints] workspace = true`.
# Suppressing a lint is forbidden everywhere: no #[allow], #![allow], #[expect],
# cfg_attr(..., allow(...)), or "allow" levels in any [lints] table. Fix the code instead.
# Levels are "warn" while the port is in progress; CI runs with -D warnings and the
# final lint stage raises everything to "deny".
[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
unreachable_pub = "warn"
unused_results = "warn"
unused_qualifications = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
single_use_lifetimes = "warn"
let_underscore_drop = "warn"
meta_variable_misuse = "warn"
redundant_lifetimes = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
variant_size_differences = "warn"
explicit_outlives_requirements = "warn"
macro_use_extern_crate = "warn"
keyword_idents = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Selected restriction lints (the full restriction group contains mutually
# contradictory lints, so it cannot be enabled wholesale without suppressions).
absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
as_underscore = "warn"
cfg_not_test = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
dbg_macro = "warn"
default_union_representation = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
error_impl_error = "warn"
exit = "warn"
expect_used = "warn"
filetype_is_file = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
indexing_slicing = "warn"
infinite_loop = "warn"
iter_over_hash_type = "warn"
large_include_file = "warn"
let_underscore_must_use = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
missing_assert_message = "warn"
missing_asserts_for_indexing = "warn"
mixed_read_write_in_expression = "warn"
multiple_inherent_impl = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
needless_raw_strings = "warn"
panic = "warn"
panic_in_result_fn = "warn"
partial_pub_fields = "warn"
pathbuf_init_then_push = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
self_named_module_files = "warn"
shadow_unrelated = "warn"
str_to_string = "warn"
string_lit_chars_any = "warn"
string_slice = "warn"
suspicious_xor_used_as_pow = "warn"
tests_outside_test_module = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unused_trait_names = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
verbose_file_reads = "warn"
wildcard_enum_match_arm = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Nothing builds ring: the workspace's rustls uses aws-lc-rs. rustls-webpki's weak `ring?/alloc`
# feature still keeps ring in Cargo.lock, and clippy's multiple_crate_versions, which reads
# `cargo metadata`, would count ring's windows-sys 0.52 beside tokio's 0.61. patches/ring is a
# stand-in without dependencies whose lib.rs is a compile_error!, so the build stops if a crate
# enables ring (PORTING.md section 2). Remove it once rustls 0.24 and rustls-webpki 0.104 are
# adopted.
#
# jni and webpki-root-certs are stand-ins of the same kind for reqwest's rustls-platform-verifier,
# whose Android branch depends on jni (jni-macros is on syn 2, everything else on syn 3) and whose
# wasm32 branch depends on webpki-root-certs (CDLA-Permissive-2.0, not in deny.toml's allow list).
# clippy's multiple_crate_versions and cargo deny read every target, so both would fail a gate
# although no Prebid Server target builds them; the Cargo.toml of each stand-in says when it goes.
[patch.crates-io]
jni = { path = "patches/jni" }
ring = { path = "patches/ring" }
webpki-root-certs = { path = "patches/webpki-root-certs" }
