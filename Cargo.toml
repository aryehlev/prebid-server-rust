[workspace]
resolver = "3"
# Workspace membership is owned by the orchestrator. Work units never edit this file;
# a unit that needs a new crate or a workspace-level change reports it instead.
members = [
    "crates/bidder-params",
    "crates/currency",
    "crates/devtools",
    "crates/differences",
    "crates/errortypes",
    "crates/freecache",
    "crates/gocompat",
    "crates/gogzip",
    "crates/gohttp-client",
    "crates/gohttp-server",
    "crates/gojson",
    "crates/gojson-derive",
    "crates/goviper",
    "crates/goyaml",
    "crates/goyaml-derive",
    "crates/gpp",
    "crates/logger",
    "crates/metrics",
    "crates/openrtb",
    "crates/openrtb-ext",
    "crates/parity",
    "crates/tcf2",
    "crates/util",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/aryehlev/prebid-server-rust"
readme = "README.md"
keywords = ["prebid", "openrtb", "header-bidding", "adtech"]
categories = ["web-programming::http-server"]
publish = false

# The single source of dependency versions. Every crate names its dependencies with
# `workspace = true` (adding features or `optional` only), so each crate has one version and one
# base feature set. Entries join only when every gate passes with them: one version per package
# in Cargo.lock (clippy::multiple_crate_versions, `cargo tree --duplicates`), deny.toml's licences
# and advisories with no exception, proc macros on syn 3 only, and offline builds.
[workspace.dependencies]
# Dev-only: the key pairs rcgen signs test certificates with.
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["alloc", "aws-lc-sys"] }
axum = { version = "0.8.9", features = ["http2"] }
base64 = "0.23.1"
bytes = "1.12.1"
# The build dependency of the 51Degrees FFI crate; aws-lc-sys already locks it.
cc = "1.11.2"
# Only the JSON format: the yaml feature pulls yaml-rust2 -> hashlink -> hashbrown 0.16 beside
# indexmap's 0.17. YAML goes through a serde-saphyr Format instead.
config = { version = "0.15.27", default-features = false, features = ["json"] }
# No features: Go writes and reads cookie values raw, and percent-encode's encoded() would turn
# the base64 padding of the uids value into %3D.
cookie = "0.18.2"
flate2 = "1.1.11"
futures-util = "0.3.34"
hmac = "0.13.0"
# pbs-server's HTTP/1.1-only connection builder (Go's header limit and read budget, which
# axum::serve does not set) and the loopback test servers; axum already locks it.
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio"] }
ipnet = "2.12.2"
log = "0.4.35"
md-5 = "0.11.0"
moka = { version = "0.12.16", features = ["sync"] }
proc-macro2 = "1.0.107"
# No protobuf: the default feature pulls protobuf 3.7 -> thiserror 1 (syn 2) beside thiserror 2.
prometheus = { version = "0.14.0", default-features = false }
psl = "2.1.257"
quote = "1.0.47"
rand = "0.10.4"
# Dev-only: test certificates. rcgen's own aws_lc_rs feature names `x509-parser?/verify-aws`,
# which puts x509-parser and untrusted 0.7.1 beside 0.9.0 into `cargo metadata`, so rcgen has no
# crypto feature and signs through an aws-lc-rs key.
rcgen = { version = "0.14.10", default-features = false }
regex = "1.13.2"
# No system-proxy (core-foundation 0.9 through system-configuration, beside 0.10): Go reads only
# the proxy environment variables. No charset. reqwest's gzip feature pins tower-http to 0.6.
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "http2", "json", "rustls"] }
# The TLS test servers; reqwest configures its own rustls. pbs-gohttp-client, which reqwest
# replaces, adds tls12 and prefer-post-quantum.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.2.0", default-features = false, features = ["deserialize", "serialize"] }
# float_roundtrip: decimal numbers parse to the f64 Go's strconv.ParseFloat gives (without it
# serde_json may be one ulp off). Never enable preserve_order or arbitrary_precision anywhere:
# Go sorts map keys, and arbitrary_precision changes what a Value number is.
serde_json = { version = "1.0.154", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.11.1"
socket2 = "0.6.5"
syn = "3.0.10"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
# 0.6, not 0.7: reqwest 0.13.5's gzip feature depends on tower-http 0.6.
tower-http = { version = "0.6.11", features = ["compression-gzip", "cors", "limit", "timeout"] }
# No attributes feature: tracing-attributes is on syn 2.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.3", features = ["v4"] }

# Lint policy. Every crate opts in with `[lints] workspace = true`.
# Suppressing a lint is forbidden everywhere: no #[allow], #![allow], #[expect],
# cfg_attr(..., allow(...)), or "allow" levels in any [lints] table. Fix the code instead.
# Levels are "warn" while the port is in progress; CI runs with -D warnings and the
# final lint stage raises everything to "deny".
[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
unreachable_pub = "warn"
unused_results = "warn"
unused_qualifications = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
single_use_lifetimes = "warn"
let_underscore_drop = "warn"
meta_variable_misuse = "warn"
redundant_lifetimes = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
variant_size_differences = "warn"
explicit_outlives_requirements = "warn"
macro_use_extern_crate = "warn"
keyword_idents = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Selected restriction lints (the full restriction group contains mutually
# contradictory lints, so it cannot be enabled wholesale without suppressions).
absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
as_underscore = "warn"
cfg_not_test = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
dbg_macro = "warn"
default_union_representation = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
error_impl_error = "warn"
exit = "warn"
expect_used = "warn"
filetype_is_file = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
indexing_slicing = "warn"
infinite_loop = "warn"
iter_over_hash_type = "warn"
large_include_file = "warn"
let_underscore_must_use = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
missing_assert_message = "warn"
missing_asserts_for_indexing = "warn"
mixed_read_write_in_expression = "warn"
multiple_inherent_impl = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
needless_raw_strings = "warn"
panic = "warn"
panic_in_result_fn = "warn"
partial_pub_fields = "warn"
pathbuf_init_then_push = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
self_named_module_files = "warn"
shadow_unrelated = "warn"
str_to_string = "warn"
string_lit_chars_any = "warn"
string_slice = "warn"
suspicious_xor_used_as_pow = "warn"
tests_outside_test_module = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unused_trait_names = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
verbose_file_reads = "warn"
wildcard_enum_match_arm = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Nothing builds ring: pbs-gohttp-client's rustls uses aws-lc-rs. rustls-webpki's weak `ring?/alloc`
# feature still keeps ring in Cargo.lock, and clippy's multiple_crate_versions, which reads
# `cargo metadata`, would count ring's windows-sys 0.52 beside tokio's 0.61. patches/ring is a
# stand-in without dependencies whose lib.rs is a compile_error!, so the build stops if a crate
# enables ring (PORTING.md section 2). Remove it once rustls 0.24 and rustls-webpki 0.104 are
# adopted.
#
# jni and webpki-root-certs are stand-ins of the same kind for reqwest's rustls-platform-verifier,
# whose Android branch depends on jni (jni-macros is on syn 2, everything else on syn 3) and whose
# wasm32 branch depends on webpki-root-certs (CDLA-Permissive-2.0, not in deny.toml's allow list).
# clippy's multiple_crate_versions and cargo deny read every target, so both would fail a gate
# although no Prebid Server target builds them; the Cargo.toml of each stand-in says when it goes.
[patch.crates-io]
jni = { path = "patches/jni" }
ring = { path = "patches/ring" }
webpki-root-certs = { path = "patches/webpki-root-certs" }
