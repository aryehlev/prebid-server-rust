  - with the live example cookie it answers {"buyeruids":{"adnxs":"rh-adnxs-uid"}} (endpoints/getuids.go:19-28)
  - expired uids are listed too (usersync/cookie.go:180-189)
  - a missing or undecodable cookie, or an opted-out one, answers {} (usersync/decoder.go:15-27, usersync/cookie.go:235-259)
  - |-
    an audienceNetwork uid of '0' is never listed (usersync/cookie.go:254-257)
  - the cookie is read, never written
- method: GET
  path: /optout
  handler: pbs/usersync.go:71
  auth: false
  params:
  - {name: optout, in: query, example: '1', type: string}
  - {name: g-recaptcha-response, in: query, example: rh-captcha, type: string}
  - {name: Cookie, in: header, example: uids=eyJ0ZW1wVUlEcyI6eyJhZG54cyI6eyJ1aWQiOiJyaC1hZG54cy11aWQiLCJleHBpcmVzIjoiMjA5OS0wMS0wMVQwMDowMDowMFoifX19}
  responses:
    '301': redirect (see rules)
    '401': the recaptcha check failed, empty body
  rules:
  - optout and g-recaptcha-response are read with FormValue, from the query or an application/x-www-form-urlencoded body (pbs/usersync.go:71-73)
  - |-
    without g-recaptcha-response: 301 to '<external_url>/static/optout.html' (http://localhost:8000/static/optout.html by default); GET gets net/http's short HTML body, POST none (pbs/usersync.go:77-80)
  - |-
    with g-recaptcha-response, the server POSTs it to https://www.google.com/recaptcha/api/siteverify (pbs/usersync.go:38-69). In parity that call goes to the oracle as kind general and fails unless the case's mock plan answers {"success":true}; a failure answers 401 with an empty body (pbs/usersync.go:82-87)
  - after a passed check, a non-empty optout writes a uids cookie with optout true and no uids, then 301 to host_cookie.opt_out_url; an empty optout writes the cookie with optout false, keeping the uids, then 301 to host_cookie.opt_in_url. Both URLs are empty by default, and net/http then sends Location / (pbs/usersync.go:89-106)
