  handler: server/prometheus.go:14
  auth: false
  responses:
    '200': Prometheus text exposition
    '503': more than 5 scrapes in flight
  rules:
  - Prometheus port only (metrics.prometheus.port, 0 turns it off; PBS_METRICS_PROMETHEUS_PORT in parity runs); every path on that port answers the same exposition (server/prometheus.go:14-27, server/server.go:70-83)
