  - the flags compare case-insensitively with true and false (TRUE works); any other value, including an empty value, answers 400 (endpoints/info/bidders.go:75-91)
  - with both flags invalid, the enabledonly message wins (endpoints/info/bidders.go:61-73)
  - without flags, the list leaves out whiteLabelOnly bidders such as teqblaze but includes disabled ones; enabledonly=true leaves out disabled bidders but keeps whiteLabelOnly ones; baseadaptersonly=true leaves out aliases (endpoints/info/bidders.go:108-126)
