- method: POST
  path: /cookie_sync
  handler: endpoints/cookie_sync.go:97
  auth: false
  params:
  - {name: Cookie, in: header, example: uids=eyJ0ZW1wVUlEcyI6eyJhZG54cyI6eyJ1aWQiOiJyaC1hZG54cy11aWQiLCJleHBpcmVzIjoiMjA5OS0wMS0wMVQwMDowMDowMFoifX19}
  - {name: User-Agent, in: header, example: Mozilla/5.0 Chrome/120.0.0.0}
  body:
    example:
      bidders:
      - appnexus
      - pubmatic
      gdpr: 0
      gdpr_consent: ''
      us_privacy: 1---
      limit: 2
      gpp: ''
      gpp_sid: ''
      coopSync: false
      filterSettings:
        iframe:
          bidders: '*'
          filter: include
        image:
          bidders:
          - appnexus
          filter: include
      account: parity-account
      debug: true
    fields:
      gdpr: {type: integer, enum: [0, 1]}
      limit: {type: integer}
      filterSettings.iframe.filter: {type: string, enum: [include, exclude]}
      filterSettings.image.filter: {type: string, enum: [include, exclude]}
  responses:
    '200': |-
      {"status":"ok"|"no_cookie","bidder_status":[{"bidder","no_cookie":true,"usersync":{"url","type"}}],"debug":[{"bidder","error"}]} plus a newline, Content-Type 'application/json; charset=utf-8', HTML not escaped (endpoints/cookie_sync.go:506-563)
    '400': |-
      text/plain '<error>\n' through http.Error: JSON, account, privacy or filter errors (endpoints/cookie_sync.go:100-103, 463-470)
    '401': |-
      'User has opted out\n' for an opted-out uids cookie (endpoints/cookie_sync.go:112-115)
  rules:
  - |-
    a body that is not valid JSON answers 400 'JSON parsing failed: <err>\n'; gdpr must be a JSON number, so "gdpr":"1" fails to parse (endpoints/cookie_sync.go:133-136, 628-640)
  - |-
    account '' becomes 'unknown'; account parity-disabled-account answers 400 'account is disabled, please reach out to the prebid server host\n'; under account-required, no account answers 400 'account must be valid if provided, please reach out to the prebid server host\n' (endpoints/cookie_sync.go:138-144, 472-489)
  - |-
    gdpr 1 without gdpr_consent answers 400 'gdpr_consent is required if gdpr=1\n' (endpoints/cookie_sync.go:228-231)
  - |-
    no gdpr and no consent under gdpr.default_value '1' (the gdpr-enforced profile) answers 400 'gdpr_consent is required. gdpr is not specified and is assumed to be 1 by the server. set gdpr=0 to exempt this request\n'; the default profile ('0') accepts it (endpoints/cookie_sync.go:233-235)
  - |-
    gdpr other than 0 or 1 answers 400 'GDPR signal should be integer 0 or 1\n' (gdpr/signal.go:16, 35-41)
  - |-
    gpp_sid must be a comma list of int8 with no spaces: '2,6' parses, '2, 6' and '128' answer 400 with the strconv.ParseInt error (endpoints/cookie_sync.go:212-215, util/stringutil/stringutil.go:10-25)
  - gpp_sid containing 2 sets the GDPR signal to 1, any other gpp_sid sets it to 0, overriding gdpr (endpoints/cookie_sync.go:267-273)
  - |-
    filter other than include or exclude answers 400 'error parsing filtersettings.iframe: invalid filter value 'x'. must be either 'include' or 'exclude'\n' (or filtersettings.image); filter bidders that are neither '*' nor a string array answer 400 (endpoints/cookie_sync.go:404-461)
  - |-
    status is 'ok' when the request cookie has any live uid, else 'no_cookie' (endpoints/cookie_sync.go:507-510)
  - 'bidder_status lists the syncers chosen: bidders already synced, unknown, without a syncer, duplicates of a chosen syncer key, rejected by the filter or by privacy are left out (usersync/chooser.go:130-218)'
  - |-
    with debug true, every bidder that was not chosen gets a debug entry: 'Already in sync', 'Unsupported bidder', 'No sync config', 'Duplicate bidder synced as <key>', 'Rejected by request filter', 'Rejected by privacy', 'Sync disabled by config'; a bidder blocked by its skipwhen settings gets an entry with no error text (endpoints/cookie_sync.go:532-551, 606-626)
  - |-
    limit is the request limit, else the account's cookie_sync.default_limit, capped by max_limit; 0 or less means no limit (endpoints/cookie_sync.go:299-332)
  - the sync URL embeds user_sync.redirect_url with external_url (http://localhost:8000 by default) and the bidder name (config/config.go:948, 1175; usersync/syncer.go:126)
  - an invalid us_privacy blanks the us_privacy macro and does not fail the request (endpoints/cookie_sync.go:152-160)
  - a receive-cookie-deprecation Set-Cookie (Partitioned) is added only when the account enables privacysandbox cookiedeprecation and the request lacks that cookie (endpoints/cookie_sync.go:565-589)
  - an opted-out cookie answers 401 even for a valid body; the body is parsed first, so a bad body still answers 400 (endpoints/cookie_sync.go:97-115)
- method: GET
  path: /status
  handler: endpoints/status.go:10
  auth: false
  responses:
