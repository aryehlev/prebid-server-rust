# ReplayHarness API map of the Go Prebid Server, the reference the Rust port
# must match. Every route the Go code registers on the main, admin and
# Prometheus listeners is here, with its handler file:line, its inputs, and the
# rules it enforces. The notes give the parity profile facts a replay needs.
#
# Format: ReplayHarness agents/replayharness-discovery.md. Check it against the
# code with parity/scripts/replayharness-context.sh (see parity/README.md).
name: Prebid Server (Go reference)
notes:
- Three listeners. The main port (port, default 8000; PBS_PORT in parity runs) serves every endpoint here unless its rules say otherwise. The admin port (admin_port, default 6060, on while admin.enabled is true) serves /debug/pprof/*, /currency/rates and its own /version (router/admin.go:13-27, server/server.go:57-68). The Prometheus port (metrics.prometheus.port, 0 turns it off) serves /metrics (server/server.go:70-83). The map has no port field, so each admin or Prometheus endpoint says so in its first rule.
- 'Main-port chain, outermost first: gzip response compression (only with compression.response.enable_gzip), NoCache, CORS, then httprouter (main.go:88-94, server/server.go:97-132). With parity.enabled, wiring.Mount answers /__parity/* before NoCache (main.go:91-93).'
- |-
  NoCache adds Cache-Control 'no-cache, no-store, must-revalidate', Pragma 'no-cache' and Expires '0' to every main-port response (router/router.go:107-116).
- |-
  CORS is rs/cors v1.11.0, configured in router/router.go:385-393. Every request that is not a preflight gets 'Vary: Origin'. With an Origin header and method GET, POST or HEAD, it also gets Access-Control-Allow-Origin echoing that Origin and Access-Control-Allow-Credentials 'true'. A preflight (OPTIONS with Access-Control-Request-Method) never reaches the router: it answers 204 with an empty body and Vary 'Origin, Access-Control-Request-Method, Access-Control-Request-Headers'. The Allow-* headers come back only when Origin is set, the requested method is GET, POST or HEAD, and the requested headers are within Origin, X-Requested-With, Content-Type and Accept.
- |-
  Router is httprouter v1.3.0 with its defaults (Router.ServeHTTP). An unknown path answers 404 '404 page not found\n' (text/plain; charset=utf-8, X-Content-Type-Options nosniff). A known path with the wrong method answers 405 'Method Not Allowed\n' with Allow listing the registered methods plus OPTIONS in sorted order, for example 'OPTIONS, POST' for GET /openrtb2/auction. HEAD is never registered, so HEAD on any main-port route is 405. OPTIONS without Access-Control-Request-Method answers 200 with Allow and an empty body. A path that differs from a route only by a trailing slash or by letter case redirects to the route: 301 for GET, 307 for other methods (GET /status/ and GET /STATUS go to /status). There is no panic handler.
- No route checks credentials, so every endpoint has auth false. Accounts are named in the request (publisher.id, account, a), not authenticated.
- |-
  Account resolution, shared by every endpoint that names an account (account/account.go:27-94). A missing account is 'unknown'. With account_required true, 'unknown' fails with AcctRequired 'Prebid-server has been configured to discard requests without a valid Account ID. Please reach out to the prebid server host.' An ID with no stored account falls back to account_defaults, and that is accepted even with account_required, unless account_defaults.disabled is true (account/account.go:43-62). A disabled account fails with 'Prebid-server has disabled Account ID: <id>, please reach out to the prebid server host.' (account/account.go:85-90). A stored account that is not valid JSON fails with MalformedAcct. Each endpoint maps these errors to its own status code.
- |-
  Built without -ldflags, the auction and AMP responses carry X-Prebid 'pbs-go/unknown', and /version answers revision and version 'not-set' (version/xprebidheader.go:12-16, endpoints/version.go:14-40).
- 'Parity runs: the runner starts the server with parity.enabled, host 127.0.0.1, ports from the free-port helper through PBS_PORT, PBS_ADMIN_PORT and PBS_METRICS_PROMETHEUS_PORT, TZ=UTC, and every outbound call going to the mock oracle on loopback (parity/runner/profiles.go:189-210, parity/runner/procs.go:128-151). The filesystem stored-data backends all read ./stored.'
- Parity requests reach the server as POST /__parity/exec envelopes. Exec dispatches any method and path through the full main-port chain, with RemoteAddr 127.0.0.1:0 and Host 127.0.0.1 unless the envelope sets them (parity/server/exec.go:131-160, parity/server/request.go:22-25). Admin-port and Prometheus-port endpoints cannot be reached through exec.
- |-
  The default parity profile is Go's defaults plus four settings: gdpr.default_value '0'; the cache at http://prebid-cache.parity.test/cache, which the oracle answers with content-addressed UUIDs; HTTP client throttling off; and ads.cert off (parity/fixtures/profiles/default.yaml). The other base profiles are account-required (account_required true), events-cache (account_defaults.events.enabled true, external_url http://pbs.parity.test, cache TTLs), floors, and gdpr-enforced (gdpr.default_value '1', tcf2 on, host_vendor_id 0). A case can add overrides through corpus.Profile (parity/corpus/profile.go:22-76).
- |-
  Parity stored data (parity/fixtures/stored), present in every run. Accounts: parity-account (enabled, no settings) and parity-disabled-account (disabled). Stored request parity-stored-request: a site request for parity-account with tmax 500, price granularity 'low' and no imp. Stored imp parity-stored-imp: a 300x250 banner bidding to appnexus with placementId 12883451. Stored response parity-stored-response: one appnexus seatbid with bid parity-bid, price 1.25, for impid parity-stored-imp. A case can bring more stored data (corpus.Case.Stored); a case that gives one of these IDs different content runs in a separate batch (parity/fixtures/stored/README.md).
- 'Parity bidders: every bidder in static/bidder-info is configured: 398 files, 116 of them aliases. 18 are disabled by default: adagio, adxcg, appStockSSP, audienceNetwork, avocet, dianomi, epom, huaweiads, ix, m152, mgidX, pangle, revcontent, rubicon, selectmedia, stroeerCore, triplelift_native, zeta_global_ssp. The oracle answers bidder calls by fixture replay, then templates, then 204. User syncers exist only for enabled bidders whose bidder info defines userSync: 235 enabled files do, for example appnexus (syncer key adnxs, redirect), pubmatic (iframe and redirect) and openx (iframe) (usersync/syncersbuilder.go:28-90).'
- |-
  Parity limits: video.enable_deprecated_endpoint is false in every profile, and corpus.Profile has no switch for it, so POST /openrtb2/video always answers 501. vtrack.enabled stays true. stored_requests.cache_events is off, so /storedrequests/* answer 404. status_response is empty, so /status answers 204. host_cookie is unset. Outbound calls the oracle has no answer for, such as the /optout recaptcha check, get its 404 unless the case's mock plan has a rule (parity/oracle/generators.go:242-261).
- |-
  To send a user-sync cookie, add the header 'Cookie: uids=<value>'. The value is the base64url encoding, with padding, of {"tempUIDs":{"<syncer key>":{"uid":"<uid>","expires":"<RFC 3339 time>"}},"optout":<bool>} (usersync/cookie.go:13, 223-259; usersync/encoder.go:16-23; usersync/decoder.go:15-27). One live adnxs uid: 'uids=eyJ0ZW1wVUlEcyI6eyJhZG54cyI6eyJ1aWQiOiJyaC1hZG54cy11aWQiLCJleHBpcmVzIjoiMjA5OS0wMS0wMVQwMDowMDowMFoifX19'. Opted out: 'uids=eyJvcHRvdXQiOnRydWV9'. A value that does not decode is treated as an empty cookie. A uid is live while its expires is in the future (usersync/cookie.go:170-177, 203-213). optout true drops every uid and blocks syncs. An audienceNetwork uid of '0' is dropped. The host cookie (host_cookie.cookie_name and family) and the opt-out cookie (host_cookie.optout_cookie) are off by default (usersync/cookie.go:135-153).
- 'Parity hazard: the uids Set-Cookie depends on the wall clock. Its Expires is now plus host_cookie.ttl_days (90), and each uid synced in the request gets expires now plus 14 days, with nanoseconds, inside the encoded value (usersync/cookie.go:93-132). Nothing in parity/schema/normalization.json masks either value, and the clock is not faked, so /setuid and /optout Set-Cookie headers differ between two processes.'
- |-
  Parity hazard: /cookie_sync without 'bidders' (and with coopSync off) evaluates every syncer in the order NewChooser got them from ranging over a map (usersync/chooser.go:18-33). The usersync.shuffle decision 'identity' keeps that order (usersync/shuffler.go:18-26), so bidder_status order differs between processes. List the bidders explicitly to get a stable order.
- |-
  Left out on purpose: /__parity/* is the harness's own surface. It is off unless parity.enabled, answers 403 to callers off loopback and 401 without the right X-Parity-Token, and is not product behaviour (parity/wiring/mount.go:43-101). parity/scripts/replayharness-context.sh does not scan parity/ or rust/. There is no /getuid route (singular); GET /getuid answers 404.
- |-
  Do not probe /debug/pprof/profile or /debug/pprof/trace: they block for their 'seconds' parameter (default 30 and 1) while they record.
endpoints:
- method: POST
  path: /openrtb2/auction
  handler: endpoints/openrtb2/auction.go:162
  auth: false
  params:
  - {name: Content-Encoding, in: header, enum: [gzip]}
  - {name: Referer, in: header, example: 'https://parity.test/page'}
  - {name: User-Agent, in: header, example: Mozilla/5.0 (X11; Linux x86_64) Chrome/120.0.0.0}
  - {name: X-Forwarded-For, in: header, example: 203.0.113.7}
  - {name: Cookie, in: header, example: uids=eyJ0ZW1wVUlEcyI6eyJhZG54cyI6eyJ1aWQiOiJyaC1hZG54cy11aWQiLCJleHBpcmVzIjoiMjA5OS0wMS0wMVQwMDowMDowMFoifX19}
  - {name: Sec-GPC, in: header, example: '1'}
  - {name: Sec-Browsing-Topics, in: header, example: '(1 2);v=chrome.1:1:2'}
  body:
    example:
      id: rh-auction-1
      site:
        page: https://parity.test/page
        publisher:
          id: parity-account
      imp:
      - id: imp-1
        banner:
          format:
          - w: 300
            h: 250
        ext:
          prebid:
            bidder:
              appnexus:
                placementId: 12883451
      tmax: 500
      ext:
        prebid:
          storedrequest:
            id: parity-stored-request
    required:
    - id
    - imp
    - imp[].id
    - imp[].ext
    fields:
      id: {type: string, min_length: 1}
      tmax: {type: integer, min: 0}
      imp[].id: {type: string, min_length: 1}
      imp[].banner.format[].w: {type: integer, min: 1}
      imp[].banner.format[].h: {type: integer, min: 1}
  responses:
    '200': OpenRTB BidResponse JSON plus a newline, Content-Type application/json, HTML not escaped; warnings are in ext.warnings (endpoints/openrtb2/auction.go:360-407). A module rejection is also 200, with nbr (endpoints/openrtb2/auction.go:340-358).
    '400': |-
      one 'Invalid request: <message>\n' line per error (endpoints/openrtb2/auction.go:1947-1972), or a BadInput error from the auction (endpoints/openrtb2/auction.go:287-291)
    '403': blocked app (blocked_apps) or disabled account (endpoints/openrtb2/auction.go:1954-1957)
    '500': |-
      malformed stored account (endpoints/openrtb2/auction.go:1958-1961), or 'Critical error while running the auction: <err>' (endpoints/openrtb2/auction.go:292-299)
  rules:
  - 'the example merges stored request parity-stored-request under the body: the stored request is the base and the body wins (JSON merge patch; endpoints/openrtb2/auction.go:1722-1841)'
  - |-
    a body larger than max_request_size (262144 bytes) answers 400 'Invalid request: request size exceeded max size of 262144 bytes.\n'; a body of exactly 262144 bytes is accepted (endpoints/openrtb2/auction.go:448-470)
  - |-
    a Content-Encoding header is rejected while compression.request.enable_gzip is false (the default): 400 'Invalid request: Content-Encoding of type gzip is not supported\n' (endpoints/openrtb2/auction.go:434-438)
  - |-
    a body without id answers 400 'Invalid request: request missing required field: "id"\n' (endpoints/openrtb2/auction.go:803-805)
  - |-
    a negative tmax answers 400 'Invalid request: request.tmax must be nonnegative. Got -1\n' (endpoints/openrtb2/auction.go:807-809)
  - |-
    an empty imp array answers 400 'Invalid request: request.imp must contain at least one element.\n' (endpoints/openrtb2/auction.go:811-813)
  - |-
    an imp without id answers 400 'request.imp[0] missing required field: "id"' (ortb/request_validator.go:38-40)
  - |-
    an imp with none of banner, video, audio or native answers 400 'request.imp[0] must contain at least one of "banner", "video", "audio", or "native"' (ortb/request_validator.go:46-48)
  - |-
    an imp without ext answers 400 'request.imp[0].ext is required' (ortb/request_validator.go:81-83)
  - |-
    two imps with the same id answer 400 'request.imp[0].id and request.imp[1].id are both "x". Imp IDs must be unique.' (endpoints/openrtb2/auction.go:950-956)
  - |-
    a banner with no w/h and no format answers 400 'request.imp[0].banner has no sizes. Define "w" and "h", or include "format" elements.' (ortb/request_validator_banner.go:43-46); banner wmin, wmax, hmin or hmax answer 400 'uses unsupported property' (ortb/request_validator_banner.go:30-41)
  - |-
    a format entry with w and h both 0 answers 400 'Request imp[0].banner.format[0] should define *either* {w, h} (for static size requirements) *or* {wmin, wratio, hratio} (for flexible sizes) to be non-zero.' (ortb/request_validator_banner.go:85-87)
  - |-
    an unknown bidder in imp.ext.prebid.bidder answers 400 'request.imp[0].ext.prebid.bidder contains unknown bidder: <name>. Did you forget an alias in request.ext.prebid.aliases?' (ortb/request_validator.go:150-152)
  - |-
    bidder params are validated against static/bidder-params/<bidder>.json: appnexus {} answers 400 'request.imp[0].ext.prebid.bidder.appnexus failed validation.\n<schema error>' (ortb/request_validator.go:133-138); with two failing bidders, parity mode reports the first by name (ortb/request_validator.go:126)
  - |-
    a disabled bidder (for example rubicon) is dropped with a BidderTemporarilyDisabled warning; if it was the only bidder, the request answers 400 'request.imp[0].ext.prebid.bidder must contain at least one bidder' (ortb/request_validator.go:139-142, 156-158)
  - |-
    with none of site, app or dooh, an implicit site is created from the Referer header (endpoints/openrtb2/auction.go:1546-1549, 1625-1649). So such a body without a Referer answers 400 'request.site should include at least one of request.site.id or request.site.page.' (endpoints/openrtb2/auction.go:1229-1247)
  - |-
    more than one of site, app and dooh answers 400 'No more than one of request.site or request.app or request.dooh can be defined' (endpoints/openrtb2/auction.go:1460-1482)
  - |-
    the account is the first of app, site or dooh .publisher.ext.prebid.parentAccount, then .publisher.id, read from the stored request first; a non-string value answers 400 'site.publisher.id must be a string' (endpoints/openrtb2/auction.go:76-87, 1991-2042)
  - |-
    publisher.id parity-disabled-account answers 403 'Invalid request: Prebid-server has disabled Account ID: parity-disabled-account, please reach out to the prebid server host.\n' (account/account.go:85-90, endpoints/openrtb2/auction.go:1954-1957)
  - under the account-required profile, a request with no publisher answers 400 with the AcctRequired message; an unknown non-empty publisher.id is still accepted (account/account.go:27-62)
  - |-
    an unknown ext.prebid.storedrequest.id answers 400 'Invalid request: Stored Request with ID="x" not found.\n', and an unknown imp.ext.prebid.storedrequest.id answers 'Stored Imp with ID="x" not found.' (stored_requests/fetcher.go:59-61, stored_requests/backends/file_fetcher/fetcher.go:30-36, 157-167)
  - |-
    a non-string ext.prebid.storedrequest.id answers 400 'ext.prebid.storedrequest.id must be a string' (endpoints/openrtb2/auction.go:1880)
  - imp.ext.prebid.storedauctionresponse.id parity-stored-response returns that seatbid without calling any bidder (stored_responses/stored_responses.go:74-81, endpoints/openrtb2/auction.go:597-603)
  - |-
    storedauctionresponse without id answers 400 'request.imp[0] has ext.prebid.storedauctionresponse specified, but "id" field is missing ' (with a trailing space); an unknown id answers 400 'Invalid request: Stored Response with ID="<id>" not found.\n' from the file fetcher (stored_responses/stored_responses.go:74-77, 138-143; stored_requests/backends/file_fetcher/fetcher.go:39-47)
  - |-
    regs.gdpr other than 0 or 1 answers 400 'request.regs.gdpr must be either 0 or 1' (endpoints/openrtb2/auction.go:1380-1407)
  - |-
    ext.prebid.channel.name set to '' answers 400 'ext.prebid.channel.name can't be empty' (endpoints/openrtb2/auction.go:1484-1497)
  - |-
    app.id listed in blocked_apps answers 403 'Prebid-server does not process requests from App ID: <id>' (endpoints/openrtb2/auction.go:1249-1262)
  - |-
    two currencies in cur add the warning 'A prebid request can only process one currency. Taking the first currency in the list, <cur>, as the active currency' and the request continues (endpoints/openrtb2/auction.go:816-818)
  - |-
    a Sec-Browsing-Topics request header adds the response header 'Observe-Browsing-Topics: ?1' (endpoints/openrtb2/auction.go:412-417)
  - |-
    request id '{{UUID}}' is replaced from the parity UUID stream; any other id is kept, because generate_request_id is false (endpoints/openrtb2/auction.go:1722-1841, config/config.go:1288)
  - |-
    a live uids cookie is read for the cookie label and the bidders' buyeruids (endpoints/openrtb2/auction.go:227-238)
- method: POST
  path: /openrtb2/video
  handler: endpoints/openrtb2/video_auction.go:123
  auth: false
  body:
    example:
      storedrequestid: parity-stored-request
      podconfig:
        durationrangesec:
        - 15
        - 30
        requireexactduration: false
        pods:
        - podid: 1
          adpoddurationsec: 30
          configid: parity-stored-imp
      site:
        page: https://parity.test/video
        publisher:
          id: parity-account
      video:
        mimes:
        - video/mp4
        protocols:
        - 2
        - 3
        w: 640
        h: 480
    required:
    - podconfig
    - podconfig.durationrangesec
    - podconfig.pods
    - podconfig.pods[].podid
    - podconfig.pods[].adpoddurationsec
    - podconfig.pods[].configid
    - video
    - video.mimes
    - video.protocols
    fields:
      podconfig.pods[].podid: {type: integer, min: 1}
      podconfig.pods[].adpoddurationsec: {type: integer, min: 1}
  responses:
    '200': 'video response JSON {adPods: [...]}, Content-Type application/json (endpoints/openrtb2/video_auction.go:429-430)'
    '400': account required (endpoints/openrtb2/video_auction.go:456-459)
    '403': blocked app or disabled account (endpoints/openrtb2/video_auction.go:452-455)
    '500': |-
      every other error, including validation errors: 'Critical error while running the video endpoint: <errors>' (endpoints/openrtb2/video_auction.go:440-472)
    '501': the endpoint is disabled (the default, and every parity profile)
  rules:
  - |-
    with video.enable_deprecated_endpoint false (the default and every parity profile), every request answers 501 'The video endpoint is deprecated and will be removed in 5.0. You may re-enable it via the host configuration setting video.enable_deprecated_endpoint', without a newline, before X-Prebid is set (endpoints/openrtb2/video_auction.go:126-130)
  - |-
    validation errors answer 500, not 400; the body is 'Critical error while running the video endpoint: ' followed by ' <error>' for each error, so there are two spaces before the first one (endpoints/openrtb2/video_auction.go:448-469)
  - a body over max_request_size is cut at max_request_size bytes and parsed, with no size error (endpoints/openrtb2/video_auction.go:179-188)
  - storedrequestid is looked up in stored_requests and merged under the body; a missing storedrequestid is an error only with video_stored_request_required (endpoints/openrtb2/video_auction.go:201-223, 669-675)
  - |-
    a pod whose configid is not a stored imp is dropped with 'unable to load configid <id>, Pod id: <podid>'; when every pod is dropped the request answers 500 'all pods are incorrect: ...' (endpoints/openrtb2/video_auction.go:261-271, 483-494)
  - |-
    validation messages include 'request missing required field: PodConfig.DurationRangeSec', 'duration array cannot contain negative or zero values', 'request missing required field: Video.Mimes' and 'request.site or request.app must be defined, but not both' (endpoints/openrtb2/video_auction.go:802-906)
  - |-
    the generated OpenRTB request id is always 'bid_id' (endpoints/openrtb2/video_auction.go:274)
  - tmax defaults to 5000 ms when 0 (endpoints/openrtb2/video_auction.go:45, 709-713)
  - an error from SetDefaults is reported with the earlier error list, not the SetDefaults error (endpoints/openrtb2/video_auction.go:285-289)
- method: GET
  path: /openrtb2/amp
  handler: endpoints/openrtb2/amp_auction.go:112
  auth: false
  params:
  - {name: tag_id, in: query, required: true, example: rh-amp-stored, type: string, min_length: 1}
  - {name: account, in: query, example: parity-account, type: string}
  - {name: curl, in: query, example: 'https://parity.test/amp-page', type: string, format: uri}
  - {name: w, in: query, example: 300, type: integer}
  - {name: h, in: query, example: 250, type: integer}
  - {name: ow, in: query, type: integer}
  - {name: oh, in: query, type: integer}
  - {name: ms, in: query, example: '300x250,320x50', type: string}
  - {name: slot, in: query, example: /1234/amp-slot, type: string}
  - {name: timeout, in: query, example: 800, type: integer, min: 0}
  - {name: gdpr_applies, in: query, type: boolean}
  - {name: consent_string, in: query, type: string}
  - {name: gdpr_consent, in: query, type: string}
  - {name: consent_type, in: query, type: integer, enum: [1, 2, 3]}
  - {name: addtl_consent, in: query, type: string}
  - {name: targeting, in: query, example: '{"site":{"keywords":"amp"}}', type: string}
  - {name: debug, in: query, enum: ['0', '1']}
  - {name: trace, in: query, enum: [verbose, basic]}
  - {name: __amp_source_origin, in: query, example: 'https://parity.test', type: string}
  - {name: Origin, in: header, example: 'https://parity.test'}
  - {name: Cookie, in: header, example: uids=eyJ0ZW1wVUlEcyI6eyJhZG54cyI6eyJ1aWQiOiJyaC1hZG54cy11aWQiLCJleHBpcmVzIjoiMjA5OS0wMS0wMVQwMDowMDowMFoifX19}
  responses:
    '200': |-
      {"targeting":{...},"ortb2":{"ext":{...}}} plus a newline, Content-Type 'text/plain; charset=utf-8' (endpoints/openrtb2/amp_auction.go:394-438)
    '400': |-
      'Invalid request: <message>\n' per fatal error: parameter, stored request or validation errors (endpoints/openrtb2/amp_auction.go:171-179, 243-254)
    '403': blocked app or disabled account (endpoints/openrtb2/amp_auction.go:212-216)
    '500': |-
      malformed stored account, or 'Critical error while running the auction: <err>' (endpoints/openrtb2/amp_auction.go:217-221, 302-320)
  rules:
  - the request is the stored request named by tag_id; parity fixtures have none with one imp, so a case must bring its own stored request (parity-stored-request has no imp) (endpoints/openrtb2/amp_auction.go:555-632)
  - |-
    a missing tag_id answers 400 'Invalid request: AMP requests require an AMP tag_id\n' (amp/parse.go:159-162)
  - |-
    an unknown tag_id answers 400 'Invalid request: Stored Request with ID="<tag_id>" not found.\n' (endpoints/openrtb2/amp_auction.go:567-571, stored_requests/backends/file_fetcher/fetcher.go:157-167)
  - |-
    tag_id=parity-stored-request answers 400 'Invalid request: data for tag_id='parity-stored-request' does not define the required imp array\n' (endpoints/openrtb2/amp_auction.go:606-609)
  - |-
    a stored request with two imps answers 400 'data for tag_id '<id>' includes 2 imp elements. Only one is allowed', and one with app answers 400 'request.app must not exist in AMP stored requests.' (endpoints/openrtb2/amp_auction.go:610-618)
  - |-
    gdpr_applies must parse with strconv.ParseBool: gdpr_applies=yes answers 400 'Invalid request: strconv.ParseBool: parsing "yes": invalid syntax\n' (amp/parse.go:185-190, 219-226)
  - |-
    timeout must be an unsigned integer: timeout=-1 answers 400 'Invalid request: strconv.ParseUint: parsing "-1": invalid syntax\n' (amp/parse.go:192-197, 202-210)
  - w, h, ow, oh and consent_type that do not parse are treated as 0, with no error (amp/parse.go:212-217)
  - timeout sets tmax to timeout minus amp_timeout_adjustment_ms (0); with tmax 0 the auction deadline is 900 ms (endpoints/openrtb2/amp_auction.go:183-189, 686-688)
  - the imp is always sent with secure 1, curl sets site.page and site.domain (the port is stripped), site.ext.amp is 1, and slot sets imp.tagid (endpoints/openrtb2/amp_auction.go:620-666)
  - account fills the publisher id only when the stored request has none, and account=ACCOUNT_ID (the unresolved macro) is ignored (endpoints/openrtb2/amp_auction.go:857-879)
  - debug=1 sets test 1 on the request (endpoints/openrtb2/amp_auction.go:602-604)
  - |-
    AMP-Access-Control-Allow-Source-Origin echoes __amp_source_origin, or else the Origin header, and Access-Control-Expose-Headers is 'AMP-Access-Control-Allow-Source-Origin' (endpoints/openrtb2/amp_auction.go:145-157)
  - targeting comes only from bids whose targeting has an hb_cache_id key, plus the response ext.prebid.targeting (endpoints/openrtb2/amp_auction.go:360-410)
  - 'suspicious: errors from processing stored responses are dropped, because the code checks err rather than errs and errs is then overwritten (endpoints/openrtb2/amp_auction.go:586-591, 628)'
- method: GET
