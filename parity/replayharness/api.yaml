- method: GET
  path: /
  handler: router/router.go:103
  auth: false
  params:
  - {name: If-Modified-Since, in: header}
  - {name: Range, in: header, example: bytes=0-9}
  responses:
    '200': static/index.html, text/html; charset=utf-8, with Last-Modified and Accept-Ranges
    '206': a Range request
    '304': If-Modified-Since at or after the file time
