- method: POST
  path: /storedrequests/openrtb2
  handler: stored_requests/events/api/api.go:36
  auth: false
  body:
    example:
      requests:
        rh-req:
          id: rh-req
      imps:
        rh-imp:
          id: rh-imp
      accounts: {}
      responses: {}
  responses:
    '200': empty; the save was handed to the in-memory cache
    '400': |-
      'Missing update data.\n' or 'Invalid update.\n'
  rules:
  - registered only when stored_requests.cache_events.enabled is true, which also needs an in-memory cache; no parity profile enables it, so parity runs answer 404 (stored_requests/config/config.go:277-280, 304-308; config/stored_requests.go:245-248)
