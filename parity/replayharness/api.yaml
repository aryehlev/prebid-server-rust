- method: GET
  path: /static/{filepath}
  handler: router/router.go:303
  auth: false
  params:
  - {name: filepath, in: path, example: bidder-info/appnexus.yaml, type: string}
  responses:
    '200': the file, or an HTML listing for a directory path that ends in /
    '301': a directory without its trailing slash, or a path ending in /index.html
    '404': |-
      '404 page not found\n' for a missing file
  rules:
  - |-
    filepath is an httprouter catch-all, so it can hold slashes; files come from net/http FileServer over the working directory's static/ (router/router.go:303)
  - /static/optout.html exists, and is where /optout sends a request without g-recaptcha-response
  - /static/index.html redirects 301 to ./, and /static/bidder-info redirects 301 to bidder-info/
  - |-
    Content-Type comes from the file extension: .json, .html and .svg are built into Go; .yaml is looked up in the host's mime.types and otherwise sniffed, so it can differ between machines
- method: POST
  path: /vtrack
  handler: endpoints/events/vtrack.go:67
  auth: false
  params:
  - {name: a, in: query, required: true, example: parity-account, type: string, min_length: 1}
  - {name: int, in: query, example: rh_int-1, type: string, max_length: 64, pattern: '^[\p{L}\p{N}_-]*$'}
  body:
    example:
      puts:
      - type: xml
        value: <VAST version="3.0"><Ad><Wrapper><AdSystem>rh</AdSystem><VASTAdTagURI><![CDATA[https://parity.test/vast]]></VASTAdTagURI><Impression></Impression><Creatives></Creatives></Wrapper></Ad></VAST>
        ttlseconds: 300
        bidid: rh-bid-1
        bidder: appnexus
        timestamp: 1629473330823
    required:
    - puts
    - puts[].bidid
    - puts[].bidder
    fields:
      puts[].type: {type: string, enum: [xml, json]}
      puts[].ttlseconds: {type: integer}
      puts[].timestamp: {type: integer}
  responses:
    '200': '{"responses":[{"uuid":"<uuid>"}]} in put order, Content-Type application/json, no newline (endpoints/events/vtrack.go:125-138, 209-232)'
    '400': |-
      missing a, a bad int, or a bad body: 'Invalid request: <err>\n' (endpoints/events/vtrack.go:70-95); account errors other than disabled, malformed or timeout (endpoints/events/vtrack.go:101-110)
    '500': |-
      'Error(s) updating vast: <first error>\n' when the cache put fails; malformed stored account (endpoints/events/vtrack.go:114-123)
    '503': disabled account (endpoints/events/event.go:218-221)
    '504': account lookup timed out (endpoints/events/event.go:225-227)
  rules:
  - registered only while vtrack.enabled is true (the default) (router/router.go:305-309)
  - |-
    missing a answers 400 'Account 'a' is required query parameter and can't be empty', with no newline (endpoints/events/vtrack.go:70-77)
  - |-
    int longer than 64 characters, or with characters other than letters, digits, '-' and '_', answers 400 'Invalid integration type: integration type length is too long\n' or '...can only contain numbers, letters and these characters '-', '_'\n'; Unicode letters are allowed (endpoints/events/vtrack.go:79-85, endpoints/events/event.go:404-414)
  - |-
    a body larger than max_request_size (262144 bytes) answers 400 'Invalid request: request size exceeded max size of 262144 bytes\n' (no period, unlike the auction); exactly 262144 bytes is accepted (endpoints/events/vtrack.go:88-95, 162-182)
  - |-
    an empty body answers 400 'Invalid request: request body is empty\n'; a put without bidid answers 'Invalid request: 'bidid' is required field and can't be empty\n', and one without bidder answers the bidder version; the first failing put wins (endpoints/events/vtrack.go:184-203)
  - the account is resolved like /event (disabled answers 503), but its events setting is never checked, although the comment says so (endpoints/events/vtrack.go:97-112)
  - '"puts": [] answers 200 {"responses":[]} without a cache call (prebid_cache_client/client.go:87-91)'
  - |-
    VAST with an </Impression> tag gets the impression event URL '<external_url>/event?t=imp&b=<bidid>&a=<account>&bidder=<bidder>&f=b&int=<int>&ts=<timestamp>' in CDATA, inside the first Impression when it is empty and as a new Impression after it otherwise; int and ts appear only when set. This happens when the bidder's info is enabled with modifyingVastXmlAllowed, or the bidder is unknown and vtrack.allow_unknown_bidder is true (the default) (endpoints/events/vtrack.go:258-318, endpoints/events/event.go:141-145, 233-270)
  - |-
    suspicious: the modified VAST goes into the cache request as raw XML, not a JSON string, so the cache body is not valid JSON (endpoints/events/vtrack.go:320-331, prebid_cache_client/client.go:173-200); in parity the oracle rejects it with 400, so /vtrack answers 500 'Error(s) updating vast: Prebid Cache call to http://prebid-cache.parity.test/cache returned 400: ...'
  - the put sent to the cache keeps only type, value, ttlseconds and key; bidid, bidder and timestamp are dropped (endpoints/events/vtrack.go:235-256)
  - only the first cache error is printed, because the loop returns (endpoints/events/vtrack.go:116-123)
- method: GET
  path: /event
  handler: endpoints/events/event.go:64
  auth: false
  params:
  - {name: t, in: query, required: true, example: imp, enum: [imp, win, vast]}
  - {name: b, in: query, required: true, example: rh-bid-1, type: string, min_length: 1}
  - {name: a, in: query, required: true, example: parity-account, type: string, min_length: 1}
  - {name: vtype, in: query, enum: [start, firstQuartile, midPoint, thirdQuartile, complete]}
  - {name: bidder, in: query, example: appnexus, type: string}
  - {name: ts, in: query, example: 1629473330823, type: integer}
  - {name: f, in: query, enum: [b, i]}
  - {name: x, in: query, enum: ['1', '0']}
  - {name: int, in: query, type: string, max_length: 64, pattern: '^[\p{L}\p{N}_-]*$'}
  responses:
    '200': 'f=i: the 1x1 PNG pixel (endpoints/events/event.go:128-134)'
    '204': the event was accepted, or x=0 (endpoints/events/event.go:88-92, 137)
    '400': |-
      one 'invalid request: <message>\n' line per parameter error (endpoints/events/event.go:66-77); account errors other than disabled, malformed or timeout
    '401': missing a, or an account whose events are disabled (endpoints/events/event.go:79-86, 113-118)
    '500': malformed stored account
    '503': disabled account
    '504': account lookup timed out (event.timeout_ms, 1000 by default)
  rules:
  - |-
    the parameter errors are collected in this order: t, vtype, b, ts, f, x, int; every one is a separate 'invalid request: ...' line (endpoints/events/event.go:148-201)
  - |-
    missing t answers "parameter 't' is required", and an unknown t answers "unknown type: 'x'" (endpoints/events/event.go:276-297)
  - |-
    t=vast requires vtype, matched case-sensitively: missing answers "parameter 'vtype' is required", other values "unknown vtype: 'x'"; vtype with t imp or win answers "parameter 'vtype' is only required for t=vast" (endpoints/events/event.go:156-164, 299-322)
  - |-
    missing b answers "parameter 'b' is required" (endpoints/events/event.go:166-171)
  - |-
    a ts that is not an int64 answers 400 with the prefix doubled: "invalid request: invalid request: error parsing timestamp 'x'\n" (endpoints/events/event.go:366-381)
  - |-
    f other than b or i answers "unknown format: 'x'", and x other than 1 or 0 answers "unknown analytics: 'x'" (endpoints/events/event.go:325-363)
  - |-
    a is checked only after the other parameters parse: then a missing a answers 401 "Account 'a' is required query parameter and can't be empty", with no newline (endpoints/events/event.go:79-86)
  - x=0 answers 204 before the account lookup, even for an unknown or disabled account (endpoints/events/event.go:88-92)
  - |-
    a=parity-disabled-account answers 503 'Invalid request: Prebid-server has disabled Account ID: parity-disabled-account, please reach out to the prebid server host.\n' (endpoints/events/event.go:101-110, 204-231)
  - |-
    the default profile has account events off, so a=parity-account answers 401 "Account 'parity-account' doesn't support events" (endpoints/events/event.go:113-118); the events-cache profile answers 204
  - f=i writes the PNG after WriteHeader(200), so the Content-Type header added afterwards is lost and net/http sniffs image/png (endpoints/events/event.go:128-134)
  - bidder is normalized case-insensitively when it is a known bidder (endpoints/events/event.go:188-196)
- method: GET
  path: /setuid
  handler: endpoints/setuid.go:40
  auth: false
  params:
  - {name: bidder, in: query, required: true, example: appnexus, type: string, min_length: 1}
  - {name: uid, in: query, example: rh-adnxs-uid, type: string}
  - {name: f, in: query, enum: [b, i]}
  - {name: account, in: query, example: parity-account, type: string}
  - {name: gdpr, in: query, enum: ['0', '1']}
  - {name: gdpr_consent, in: query, type: string}
  - {name: gpp, in: query, type: string}
  - {name: gpp_sid, in: query, example: '2,6', type: string, pattern: '^(-?[0-9]+(,-?[0-9]+)*)?$'}
  - {name: Cookie, in: header, example: uids=eyJ0ZW1wVUlEcyI6eyJhZG54cyI6eyJ1aWQiOiJyaC1hZG54cy11aWQiLCJleHBpcmVzIjoiMjA5OS0wMS0wMVQwMDowMDowMFoifX19}
  - {name: User-Agent, in: header, example: Mozilla/5.0 Chrome/120.0.0.0}
  responses:
    '200': uids Set-Cookie written; f=i answers the 1x1 PNG with Content-Type image/png and Content-Length, f=b answers text/html with Content-Length 0 (endpoints/setuid.go:178-190)
    '400': the error text, no newline (endpoints/setuid.go:429-438)
    '401': opted-out cookie, empty body (endpoints/setuid.go:52-56)
    '451': privacy activity sync-user denied (empty body), or the consent forbids the host cookie (endpoints/setuid.go:113-120, 406-427)
  rules:
  - |-
    bidder is the bidder name, matched case-insensitively (appnexus, AppNexus), not the syncer key: bidder=adnxs answers 400 'The bidder name provided is not supported by Prebid Server' (endpoints/setuid.go:321-340)
  - |-
    missing bidder answers 400 '"bidder" query param is required' (endpoints/setuid.go:324-326)
  - |-
    a bidder with no syncer, such as the disabled rubicon or a bidder without userSync, answers 400 'The bidder name provided is not supported by Prebid Server' (endpoints/setuid.go:334-337)
  - |-
    f other than b or i (case-insensitive) answers 400 '"f" query param is invalid. must be "b" or "i"'; an empty or missing f uses the syncer's default type: redirect is i, iframe is b (endpoints/setuid.go:356-375)
  - |-
    account parity-disabled-account answers 400 'account is disabled, please reach out to the prebid server host'; under account-required, no account answers 400 'account must be valid if provided, please reach out to the prebid server host' (endpoints/setuid.go:73-94, endpoints/cookie_sync.go:472-489)
  - |-
    gpp_sid that is not a comma list of int8 ('2, 6', '128', 'x') answers 400 'invalid gpp_sid encoding, must be a csv list of integers' (endpoints/setuid.go:96-107)
  - |-
    gdpr other than 0 or 1 answers 400 'the gdpr query param must be either 0 or 1. You gave <value>' (endpoints/setuid.go:246-262)
  - |-
    gdpr=1 without a consent answers 400 'GDPR consent is required when gdpr signal equals 1' (endpoints/setuid.go:216-218)
  - gpp_sid and gpp take precedence over gdpr and gdpr_consent; a conflict is only a warning (endpoints/setuid.go:197-239, 255-277)
  - with gdpr.host_vendor_id 0, as in every parity profile, the host cookie is always allowed, so any gdpr_consent passes, even one that does not parse (gdpr/gdpr.go:68-72, gdpr/impl.go:233-237)
  - uid sets tempUIDs.<syncer key> (adnxs for appnexus) with expires now + 14 days; an empty or missing uid removes that key (endpoints/setuid.go:145-156, usersync/cookie.go:116-132)
  - |-
    the Set-Cookie is 'uids=<base64url>; Path=/; Expires=<now + 90 days>'; with a Chrome or CriOS User-Agent of version 67 or later it adds Secure and SameSite=None (usersync/cookie.go:93-113, endpoints/setuid.go:159, 377-404)
  - a uid already in the cookie is replaced, and the other uids are kept
  - |-
    when host_cookie.max_cookie_size_bytes is set and a non-priority syncer does not fit, the response is 200 'Warning: syncer key is not a priority, and there are only priority elements left, cookie not updated' (endpoints/setuid.go:162-177)
- method: GET
  path: /getuids
  handler: endpoints/getuids.go:19
  auth: false
  params:
  - {name: Cookie, in: header, example: uids=eyJ0ZW1wVUlEcyI6eyJhZG54cyI6eyJ1aWQiOiJyaC1hZG54cy11aWQiLCJleHBpcmVzIjoiMjA5OS0wMS0wMVQwMDowMDowMFoifX19}
  responses:
    '200': '{"buyeruids":{"<syncer key>":"<uid>"}} plus a newline, or {} plus a newline with no uids; no Content-Type is set, so it is sniffed as text/plain; charset=utf-8'
