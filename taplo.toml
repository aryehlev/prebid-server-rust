# taplo (TOML formatter) settings for every TOML file in the Rust workspace.
# CI runs, from the workspace root:  taplo fmt --check --config taplo.toml
# .upstream/ is the fetched upstream checkout (scripts/fetch-upstream.sh), not workspace code.
# taplo does not read .gitignore, so it is excluded here.
include = ["**/*.toml"]
exclude = ["target/**", "legacy/**", ".upstream/**"]

[formatting]
indent_string = "    "
column_width = 100
inline_table_expand = false
allowed_blank_lines = 1
