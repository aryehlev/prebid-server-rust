    message trimmed by `tryExtractErrorMessage` (`cannot unmarshal main.idTarget.ID: expects \" \
    or n, but found 1`, `there are bytes left after unmarshal`), `Marshal` with a \
    `FailedToMarshal`, and MergeClone with `cannot unmarshal <Type.Field>: <message>`; Prebid \
    puts the text into its own (`Invalid request format: ...`)."""
rust = """\
    The same wrappers, error types and Prebid texts (`invalid type`, `invalid json on existing \
    object`), with serde_json's message inside (`trailing characters` and its position where \
    jsoniter says `there are bytes left after unmarshal`)."""
who = ["publisher", "bidder"]
visible_in = """\
    The texts of 400 responses, of `ext.errors` and `ext.warnings`, and of the bidder errors \
