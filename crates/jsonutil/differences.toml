[[difference]]
id = "json.find-element-tokens"
category = "json"
status = "restored"
title = "`FindElement` and `DropElement`: Go cuts at the offsets of `encoding/json`'s token walk, which serde_json has no equivalent of"
go = """\
    `jsonutil.FindElement` walks the document with `encoding/json`'s `Decoder` (`Token`, \
    `Decode`, `More`, `InputOffset`) and returns the span of the first member named, with one \
    neighbouring comma; its errors are the decoder's (`EOF`, `unexpected EOF`, the state \
    machine's texts) and its comma and colon scans panic past the end. `DropElement` cuts the \
    span out of the bytes, which the Audience Network adapter sends as the request body."""
rust = """\
    serde_json has no token decoder: reading the document as a `Value` and writing it back loses \
    the input's bytes, Go's offsets and its errors."""
who = ["bidder"]
visible_in = """\
    The Audience Network adapter's request body, `consented_providers_settings` cut out \
    (adapters/audienceNetwork/facebook.go:101)"""
pin = "crates/jsonutil/tests/element.rs::drop_element_cases_match_go"
restore = """\
    `find_element` and `drop_element` port the walk's states, errors, offsets and index panics, \
    with serde_json reading each scalar and the matched value: Prebid-authored bytes."""
rule_b = "d"

