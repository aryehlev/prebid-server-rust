# pbs-jsonutil's differences from Go (see the pbs_differences ledger module for the schema):
# Prebid's util/jsonutil on serde_json, and the RFC 7386 merge json-patch implements where Go calls
# evanphx/json-patch v5.9.0's MergePatch. The [[restoration]] tables give the JSON entries that
# crates/differences records for JSONUTIL their restore pins. pbs-differences validates this file
# and writes docs/DIFFERENCES.md and docs/differences.json from every fragment.

[[restoration]]
id = "json.lone-surrogates"
pin = "crates/jsonutil/tests/decode.rs::lone_surrogates_decode_to_replacement"
note = """\
    `replace_lone_surrogates` runs on outside bytes in `unmarshal`, `unmarshal_valid`, \
    `merge_clone`, `merge_patch`, `find_element` and the lenient readers: a lone surrogate \
    escape in a value or a key decodes to U+FFFD, as both Go decoders give it."""

[[restoration]]
id = "json.lone-surrogates"
pin = "crates/jsonutil/tests/readers.rs::seeded_strings_match_go"
note = """\
    50,000 seeded strings of plain text, escapes, lone surrogates, pairs and broken escapes give \
    jsoniter's bytes or its failure."""

[[restoration]]
id = "json.null-into-value"
pin = "crates/jsonutil/tests/decode.rs::null_leaves_zero_value"
note = """\
    `null_default` with a container `#[serde(default)]` leaves each value field's zero value, as \
    `jsonutil.Unmarshal`, `UnmarshalValid` and `json.Unmarshal` do; ORTB-SERDE's typegen puts it \
    on the generated types."""

