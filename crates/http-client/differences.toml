[[difference]]
id = "http-client.gzip-edges"
category = "http-client"
status = "ledgered"
title = "Gzip responses at the edges: upper case, empty bodies and corrupt streams"
go = """\
    The Transport decompresses a `Content-Encoding` of `gzip` in any case (`GZIP`), keeps \
    `Content-Encoding` and `Content-Length` on a gzip response without a body (a 204, or \
    `Content-Length: 0`), and reads a gzip body too short for its header as `unexpected EOF`."""
