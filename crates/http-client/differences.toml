[[difference]]
id = "http-client.http2"
category = "http-client"
status = "ledgered"
title = """\
    Bidder requests with HTTP/2 on: Go's bidder client speaks HTTP/1.1 only, the bidder client \
    takes HTTP/2"""
go = """\
    Every bidder request goes over HTTP/1.1: router.go's bidder Transport sets neither \
    `ForceAttemptHTTP2` nor `Protocols` (router/router.go:143-158), so `Transport.protocols` \
    leaves HTTP/2 off (net/http/transport.go:477)."""
rust = """\
    With `http_client.http2.enabled` on (`http-client.http2-opt-in`; off, the default, the \
    bidder client speaks HTTP/1.1 only, as Go's does), the bidder client \
    (`Builder::negotiate_http2`) offers ALPN `h2` and `http/1.1` over TLS and speaks what the \
    bidder picks, over a pool of h2 connections per origin, and speaks h2c with prior \
    knowledge to a cleartext bidder it reaches without a proxy once the bidder has answered a \
    probe with SETTINGS (`http-client.h2c-probe`), from the origin's request after the probe. \
    `User-Agent` stays `Go-http-client/1.1` on h2 (D-UA), where Go's HTTP/2 sends \
    `Go-http-client/2.0`. The request's fields and body are the ones it carries over HTTP/1.1, \
    its host going as the `:authority` pseudo-header field, with two exceptions. A POST, PUT or \
    PATCH without a body carries `content-length: 0`, as Go's requests do over HTTP/1.1, so \
    `http-client.empty-body-length` holds over HTTP/1.1 only. The connection-specific fields \
    that HTTP/2 forbids (RFC 9113 section 8.2.2) are left out, as Go's HTTP/2 client leaves \
    them out: gamma's `Connection: keep-alive` (adapters/gamma/gamma.go:134), which Go's bidder \
    client sends, does not reach a gamma that takes h2. A request whose stream the bidder \
    refuses unread (`REFUSED_STREAM`), or leaves out of a graceful `GOAWAY`, goes again over \
    HTTP/2 at once, at most twice more (the pool retries as reqwest's default retry of protocol \
    NACKs does), where Go's \
    HTTP/2 client, which Go's bidder client does not use, sends it again up to seven times \
    more, backing off a second and longer after the first (net/http/h2_bundle.go:7893-7923); \
    HTTP/1.1 has neither signal. A bid request whose http URL redirects to an https one follows \
    the redirect over HTTP/1.1, as Go's does: the client that sent it chooses the protocols of \
    every hop (`crates/http-client/tests/h2.rs::cleartext_redirect_to_tls_stays_on_http1`). Every \
    other client stays on HTTP/1.1, and so does the general client's own half, which the \
    modules, stored requests and vendor list send through (`Builder::build_general`, \
    `crates/http-client/tests/h2.rs::only_the_bidders_negotiate_http2`)."""
who = ["bidder"]
visible_in = """\
    The protocol of bid requests to bidders that offer h2 over TLS or take h2c, the \
    connection-specific fields of those requests (gamma's `Connection`), and the requests sent \
    again after a bidder refuses a stream"""
pin = "crates/http-client/tests/h2.rs::alpn_and_h2c_selection"
restore = """\
    `http_client.http2.enabled` off, the default: the bidder client speaks HTTP/1.1 only, as Go's \
    does (`crates/http-client/tests/h2.rs::http2_off_is_go`)."""
note = """\
    `crates/http-client/tests/h2.rs::user_agent_on_h2` compares the h2 and h2c requests' \
    pseudo-header fields, fields and body with the ones Go's HTTP/2 client sends, \
    `crates/http-client/tests/h2.rs::connection_fields_dropped_on_h2` compares gamma's with the \
    head Go's bidder client writes over HTTP/1.1 and the requests Go's HTTP/2 client sends \
    (testdata/golden/h2.json), `crates/http-client/tests/h2.rs::empty_bodies_framed_on_h2` \
    compares the lengths of requests without a body with Go's (testdata/golden/headers.json), \
    and `crates/http-client/tests/h2.rs::refused_streams_go_again` pins the requests sent again \
    after a refused stream. Over h2c, a request refused three times fails as \
    `http-client.h2c-demotion` says."""

[[difference]]
id = "http-client.http2-opt-in"
category = "http-client"
status = "extension"
title = "HTTP/2 to bidders: `http_client.http2.enabled`, off by default"
go = """\
    Go's bidder client speaks HTTP/1.1 only: router.go's Transport sets neither \
    `ForceAttemptHTTP2` nor `Protocols` (router/router.go:143-158). Go has no \
    `http_client.http2.enabled` key; a file that sets it is decoded without it."""
rust = """\
    `http_client.http2.enabled` (a bool, default false, cast as Viper casts a key with a bool \
    default: `PBS_HTTP_CLIENT_HTTP2_ENABLED` or pbs.yaml; Viper's `AllSettings` and `AllKeys` \
    list it) turns on HTTP-H2's negotiation for the bidder client and the general client's \
    bidders' half, and no other client: ALPN `h2` over TLS, the h2c probe in cleartext and the \
    demotions (`http-client.http2`, `http-client.h2c-probe`, `http-client.h2c-demotion`, \
    `http-client.h2c-redirects`). Each bidder origin on h2 or h2c reached without a proxy gets a \
    pool of h2 connections, which pbs-http-client speaks with h2 itself as reqwest and hyper do: \
    a request takes the connection with the most free streams (the peer's \
    `SETTINGS_MAX_CONCURRENT_STREAMS` less its open streams; the requests that come while a \
    connection opens wait for its SETTINGS, at most a second, then choose again); when every \
    connection is full another opens, each holding one `max_connections_per_host` slot while it \
    is open, and past the cap a request waits for a free stream or slot; a connection that gets \
    GOAWAY or fails leaves the pool while its streams in flight finish; one idle for \
    `idle_connection_timeout_seconds` closes. There is no other knob. Over TLS the pool offers \
    `h2` and `http/1.1`; an origin that picks `http/1.1` has that connection closed unused and \
    gets its requests over reqwest's connections for ten minutes, so it sees one more TLS \
    handshake every ten minutes. Requests through a proxy, or with a streamed body, go over \
    reqwest as before (h2 inside a proxy's tunnel on one connection). The pool dials a name's \
    addresses one after another, where reqwest's connector and Go's dialer race IPv6 and IPv4 \
    after 300 ms. Responses read as reqwest's HTTP/2 gave them: hyper's body rules, tower-http's \
    gzip decompression and reqwest's error texts \
    (`crates/http-client/tests/pool.rs::pooled_bodies_read_as_reqwest_h2`)."""
who = ["operator", "bidder"]
visible_in = """\
    The `http_client.http2.enabled` key; with it on, the protocol of bid requests, the \
    connections bidders see and the adapter connection metrics"""
pin = "crates/http-client/tests/h2.rs::http2_off_is_go"
note = """\
    Orchestrator ruling 10 (a). Off, the bidder client offers only `http/1.1`, sends no probe and \
    opens Go's connections (the pin runs h2.json's selection servers through the bidder client \
    and the general client's bidders' half with the key off, and through a plain client with it \
    on). The pool's pins are in `crates/http-client/tests/pool.rs`: streams to the least-loaded \
    connection, another connection at a small `SETTINGS_MAX_CONCURRENT_STREAMS`, the cap's wait, \
    GOAWAY's drain, idle close, an h2c origin with one probe, the metrics, cancellation and \
    deadlines, and no request read twice. \
    `crates/config/tests/loader.rs::http2_enabled_converts_like_viper` pins the key's \
    conversion and `crates/config/tests/loader.rs::extension_keys_off_by_default` its default."""

[[difference]]
id = "http-client.h2c-probe"
category = "http-client"
status = "ledgered"
title = "Cleartext bidders: Go never probes, the bidder client probes each origin for h2c"
go = "Go connects to a bidder only to send it a request, and sends no probe."
rust = """\
    With `http_client.http2.enabled` on (`http-client.http2-opt-in`; off, no probe is sent), a \
    cleartext origin that a bid request goes to without a proxy, with no verdict in force, gets \
    one probe connection per `H2C_VERDICT_TTL` (ten minutes), opened as such a request goes over \
    HTTP/1.1 and never at startup. The probe carries HTTP/2's preface, an empty SETTINGS frame \
    and, after a SETTINGS answer, GOAWAY, then closes; it carries no bid request. Any other \
    answer, a close, or no answer within `H2C_PROBE_TIMEOUT` (five seconds) keeps the origin on \
    HTTP/1.1. Go's HTTP/1.1 server reads the preface as a `PRI * HTTP/2.0` request: behind a \
    ServeMux it answers 400 and closes, and a bare handler runs for it (testdata/golden/h2.json). \
    The probe's connection is in no connection metric."""
who = ["bidder"]
visible_in = """\
    Connections to cleartext bidders (one more per origin every ten minutes), and the `PRI * \
    HTTP/2.0` request an HTTP/1.1 bidder's server reads"""
pin = "crates/http-client/tests/h2.rs::probe_sends_no_request"
note = """\
    The cases that move tokio's clock on, a stalling server and the verdicts' lifetime, run with \
    `cargo test -p pbs-http-client --locked --offline -- --ignored h2c`. The pool keeps one probe \
    per origin: `crates/http-client/tests/pool.rs::h2c_origin_pooled_after_one_probe`."""

[[difference]]
id = "http-client.h2c-demotion"
category = "http-client"
status = "ledgered"
title = """\
    Failures over h2c: the request goes again over HTTP/1.1 only when the bidder read none of it"""
go = """\
    No h2c: every bidder request goes over HTTP/1.1 and succeeds wherever the bidder serves \
    HTTP/1.1."""
rust = """\
    With `http_client.http2.enabled` on (`http-client.http2-opt-in`), a request to an origin \
    marked h2c that answers the preface with HTTP/1.x is sent again once \
    over HTTP/1.1: h2's client reads the status line as a frame header too large \
    (`FRAME_SIZE_ERROR`), as Go's framer does ("the frame header looked like an HTTP/1.1 \
    header"), so the origin read no request. So is one whose new connection failed before it \
    was ready to take the request, in HTTP/2's handshake or closed by then; one whose pooled \
    connection turns out gone before the request's stream opened goes to another of the pool's \
    connections, at most twice, and then over HTTP/1.1 the same way. One that fails \
    otherwise, on an HTTP/2 error of either side or a connection that resets or closes, \
    unanswered or after the origin read it, is not sent again and fails once: a bidder error and \
    no bid from that request. Either way the origin is back on HTTP/1.1 for `H2C_VERDICT_TTL`; a \
    failed connect or a deadline keeps the verdict."""
who = ["bidder", "publisher"]
visible_in = """\
    Bid requests to a cleartext bidder that stops taking h2c: each request on its way over h2c \
    then (on the pool's connections), sent again over HTTP/1.1 or a bidder error"""
pin = "crates/http-client/tests/h2.rs::demotion_resends_only_unread"
note = """\
    A connection that closes unanswered once it took the request is not resent either: the client \
    cannot tell an origin that read no request from one that read it and closed. The pool speaks \
    h2 itself, so it tells a stream that never opened from one that did by h2's own errors, and \
    the notes on hyper's dispatch (`Canceled`, `DispatchGone` and its request queue) no longer \
    apply. An h2c origin that sent a frame past RFC 9113's size limit after reading a request \
    would fail the same way as an HTTP/1.x answer and read the request again. A request sent \
    again can report two DNS lookups to its trace (the DNS time metric), its h2c connection's and \
    its HTTP/1.1 connection's, where Go's one HTTP/1.1 request reports one."""

[[difference]]
id = "http-client.h2c-redirects"
category = "http-client"
status = "ledgered"
title = "Redirects over h2c: followed on the request's origin only"
go = """\
    Go's bidder client follows a bidder's redirect to any origin over HTTP/1.1, up to ten \
    requests (net/http/client.go `Client.do`). On a 307 or 308 it sends the bid request, body \
    included, to the new origin, and the adapter reads that origin's answer, which can carry a \
    bid; a 301, 302 or 303 turns the POST into a GET without a body \
    (testdata/golden/redirects.json: `post_307_cross_host`, `post_301` to `post_303`)."""
rust = """\
    With `http_client.http2.enabled` on (`http-client.http2-opt-in`), over h2c the client follows \
    the redirects that stay on the request's origin, as Go does. A \
    redirect to another origin comes back unfollowed, and the adapter reads the 3xx as the \
    bidder's answer, an unexpected status, which the adapters make a bidder error (for example \
    adapters/response.go:10-24): that request brings no bid, where Go's client, following a 307 \
    or 308, can still get one. The request is not sent again, because the origin has read it \
    (orchestrator ruling 5). The first such answer moves the origin back to HTTP/1.1 for \
    `H2C_VERDICT_TTL`, where its requests' redirects are followed as Go follows them; requests \
    already on their way over h2c then come back unfollowed too when the bidder redirects them \
    the same way. Once the verdict runs out a probe can mark the origin h2c again, so a bidder \
    that keeps redirecting to another origin loses, once per verdict, the requests sent to it \
    over h2c before its first redirect came back. The h2c connection speaks prior knowledge, \
    which only the probed origin takes."""
who = ["bidder", "publisher"]
visible_in = """\
    Bid requests over h2c that a bidder redirects to another origin: the 3xx in place of the \
    redirected answer, a bidder error and no bid, for the requests sent before the first such \
    answer came back, once per verdict"""
pin = "crates/http-client/tests/h2.rs::h2c_redirects_stay_on_the_origin"
restore = """\
    `http_client.http2.enabled` off, the default, follows every redirect over HTTP/1.1 as Go's \
    client does. With it on, the pool already follows each hop itself, as reqwest's policy and \
    tower-http's redirect rules do (method, body, credentials, `Referer` and Go's ten requests), \
    so a hop to another origin could go over HTTP/1.1 instead of coming back; that changes \
    orchestrator ruling 5 and is not planned."""

