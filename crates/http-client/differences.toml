[[difference]]
id = "http-client.error-texts"
category = "http-client"
status = "ledgered"
title = "Error texts: Go's `*url.Error` texts, reqwest's error chains"
go = """\
    A request that fails reads `Post \"http://127.0.0.1:PORT/e\": EOF` when the server closes \
    the connection, `Post \"http://127.0.0.1:PORT/e\": dial tcp 127.0.0.1:PORT: connect: \
    connection refused` when nothing listens, and `Get \"https://bidder.test/p?q=1\": Forbidden` \
    when a proxy refuses the CONNECT, in bidder errors and debug output. The URL is the request's \
    as `URL.String` writes it back, `http://127.0.0.1:PORT?x=1` for one without a path, or the hop \
    that failed after a redirect (net/http/client.go `Client.do`)."""
rust = """\
    The same `<Method> \"<url>\"` shape, then reqwest's chain: `error sending request: client \
    error (SendRequest): connection closed before message completed`, `error sending request: \
    client error (Connect): tcp connect error: Connection refused (os error 111)` on Linux, and \
    `error sending request: client error (Connect): tunnel error: unsuccessful`. The URL is the \
    url crate's serialisation, which writes a URL without a path with `/` \
    (`http://127.0.0.1:PORT/?x=1`), and a hop that fails after a redirect goes by the first \
    request's URL, the only one reqwest's error keeps. A deadline stays `context deadline \
    exceeded`, which bidder.go:616-620 reports."""
