# pbs-http-client's entries in the differences ledger (see the pbs_differences ledger module for
# the schema): where router.go's clients on reqwest differ from Go's net/http clients, and where
# the crate keeps Go's behaviour. Each pin compares the clients with a golden written by
# testdata/go. After a change run
#   cargo run -p pbs-differences --locked --offline -- --write

[[restoration]]
id = "http-client.user-agent"
pin = "crates/http-client/tests/headers.rs::default_user_agent_is_go"
note = """\
    The general client writes Go's `User-Agent` line for every case of headers.json: \
    `Go-http-client/1.1` when the caller set none, the first of two values, and none for an \
    empty one."""

[[difference]]
id = "http-client.accept-encoding"
category = "http-client"
status = "ledgered"
title = """\
    Caller-set Accept-Encoding or Range: Go's Transport leaves the response compressed, reqwest \
    decompresses it"""
go = """\
    The Transport asks for gzip and decompresses only when the request has neither \
    `Accept-Encoding` nor `Range`; an adapter that sets `Accept-Encoding` itself (gamma.go:136) \
    or sends a `Range` gets the compressed body with `Content-Encoding` and `Content-Length` \
    (net/http/transport.go `persistConn.roundTrip`)."""
rust = """\
    reqwest's gzip asks for gzip unless the caller set `Accept-Encoding`, even beside a `Range`, \
    and decompresses every gzip response, so such an adapter gets the decompressed body without \
    `Content-Encoding` or `Content-Length`."""
who = ["bidder", "publisher"]
visible_in = "Bids of adapters that set Accept-Encoding or Range, when the bidder answers with gzip"
pin = "crates/http-client/tests/compression.rs::caller_accept_encoding_body_decompressed"
restore = """\
    A second client with gzip off for requests whose adapter set Accept-Encoding (not planned)."""

[[difference]]
id = "http-client.connection-metrics"
category = "http-client"
status = "ledgered"
title = "Connection metrics: httptrace hooks in Go, reconstructed events here"
go = """\
    bidder.go's httptrace hooks (exchange/bidder.go:732-798) take `GetConn` to `GotConn` as the \
    connection wait with its `Reused` flag, which also moves a bidder's `http_client.throttle` \
    health when the connection was reused, `DNSStart` to `DNSDone` as the DNS time, \
    `TLSHandshakeStart` to `TLSHandshakeDone` as the TLS handshake time and, when \
    `metrics.disabled_metrics.adapter_connections_dial_metrics` is false, `ConnectStart` to \
    `ConnectDone` as the adapter's dial time, a dial that fails counting as a dial error."""
rust = """\
    The clients report `Event::Dns` from their resolver and `Event::GotConn` off the response, \
    its reuse read from the connection's addresses and its wait the wait for the \
    `max_connections_per_host` slot alone, so a new connection's wait leaves out its dial and a \
    request that fails before its response head reports no `GotConn`; there is no dial or TLS \
    handshake event, so no TLS handshake time, dial time or dial error is recorded."""
who = ["operator"]
visible_in = """\
    The adapter connection created, reused, wait, dial time and dial error metrics, the DNS and \
    TLS handshake time metrics, and bidder throttling under `http_client.throttle`"""
pin = "crates/http-client/tests/metrics.rs::events_recorded"
restore = """\
    A connector layer that times dials and TLS handshakes, once tower-layer and tower-service \
    are in the crate stack."""

