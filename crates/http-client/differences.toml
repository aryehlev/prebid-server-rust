    reqwest decompresses a lower-case `gzip` only, so a `GZIP` body reaches the adapter \
    compressed; it drops `Content-Encoding` and `Content-Length` of the empty responses; and a \
    corrupt body reads as `error decoding response body: Invalid gzip header`."""
who = ["bidder"]
