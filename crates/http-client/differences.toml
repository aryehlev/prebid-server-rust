    `http://LocalHost/`; `url.Parse` reads an IPv6 zone in a request's URL \
    (`http://[fe80::1%25en0]/`) or a proxy's; a proxy value such as `bogus url` is used as the \
    URL `bogus%20url`, whose dial fails; and the Transport dials a proxy whose host `url.Parse` \
    reads as empty on the local machine (net/http/transport.go `canonicalAddr`): `:3128`, read \
    as `http://:3128`, at port 3128, and `//proxy.test:8080`, `/proxy` or `http:proxy.test` at \
    port 80."""
rust = """\
    The url crate lower-cases the host, and the clients never proxy localhost in any case; it \
    parses no IPv6 zone, so such a URL makes no request and such a proxy is refused; the clients \
    refuse a proxy value the url crate reads as no http or https URL with a host (`bogus url`, \
    `http://:3128`); and the url crate takes the host of `http:////proxy.test:8080`, \
    `http:///proxy` and `http:proxy.test` from what follows the scheme, so the clients dial \
    `proxy.test:8080`, `proxy:80` and `proxy.test:80`."""
who = ["operator"]
