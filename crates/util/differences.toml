[[difference]]
id = "url.escape-sets"
category = "url"
status = "restored"
title = "`url.QueryEscape` and `url.PathEscape`: Go's byte sets, which no crate's set equals"
go = """\
    `url.QueryEscape` keeps ASCII letters, digits and `-_.~`, writes a space as `+` and every \
    other byte as an upper-case `%XX`; `url.PathEscape` also keeps `$&+:=@` and writes a space \
    as `%20`."""
rust = """\
    form_urlencoded's `byte_serialize` keeps `*` and escapes `~`, and the url crate's path and \
    query sets keep other bytes still, so none writes Go's bytes."""
who = ["bidder", "publisher"]
visible_in = """\
    The values Prebid's macros and user sync URLs escape (macros/provider.go, \
    usersync/syncer.go) and the URLs 23 adapters build"""
pin = "crates/util/tests/urlutil.rs::escape_like_go"
restore = """\
    `pbs_util::urlutil::query_escape` and `path_escape`: percent-encoding sets equal to Go's \
    `shouldEscape` in its two modes."""
rule_b = "d"

