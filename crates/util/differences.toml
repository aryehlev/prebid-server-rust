[[difference]]
id = "gzip.content-encoding-lower"
category = "gzip"
status = "ledgered"
title = "`ContentEncoding.Normalize`: U+0130 lower-cases to two characters in std, to one in Go, so `gzİp` is gzip only in Go"
go = """\
    `strings.ToLower` lower-cases each rune on its own: U+0130 LATIN CAPITAL LETTER I WITH DOT \
    ABOVE becomes a plain `i`, so `gzİp` and `GZİP` normalise to `gzip`, and Σ becomes σ \
    wherever it stands."""
rust = """\
    `str::to_lowercase` writes Unicode's full lower case: U+0130 becomes `i` and U+0307 \
    COMBINING DOT ABOVE, so no such value normalises to `gzip`, and a Σ that ends a word \
    becomes ς."""
who = ["publisher"]
visible_in = """\
    The 400 text of `/openrtb2/auction` with `compression.request.enable_gzip` on, for a \
    `Content-Encoding` that spells gzip with U+0130: Go's `IsSupported` accepts `gzİp` and \
    `getCompressionEnabledReader`, which compares the header as sent, answers `unsupported \
    compression type 'gzİp'`, where the port's `IsSupported` refuses it and the text is \
    `Content-Encoding of type gzİp is not supported` (endpoints/openrtb2/auction.go:424-430, \
    588-593; config/compression.go:15-20)"""
pin = "crates/util/src/httputil/tests.rs::misc_golden"
restore = "Lower-case each character on its own, U+0130 to `i`; not planned."

[[difference]]
