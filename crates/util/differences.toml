# schema): the crates that stand for Go's net, net/url, regexp, time, math/rand and
# benbjohnson/clock, and the [[restoration]] tables that give the entries crates/differences
# records for UTIL-CRATES their restore pins. pbs-differences validates this file and writes
# docs/DIFFERENCES.md and docs/differences.json from every fragment.

