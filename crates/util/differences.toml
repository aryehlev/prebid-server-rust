[[difference]]
id = "time.now-wall-clock"
category = "time"
status = "ledgered"
title = "`timeutil.RealTime`: Go's `time.Now` is in the local zone with a monotonic reading, the port's the UTC wall clock"
go = """\
    `RealTime.Now` is `time.Now()`: in `time.Local`, so a host whose zone is not UTC writes its \
    offset, and with a monotonic reading that `Sub` uses."""
rust = """\
    `RealTime::now` and `RealClock::now` are `OffsetDateTime::now_utc()`: UTC, and wall-clock \
    only, so a step of the system clock moves the difference of two readings."""
who = ["bidder", "operator"]
visible_in = """\
    On a host whose zone is not UTC, the `tzo` query parameter of adnuntius's bidder requests, \
    minus the zone's offset in minutes in Go and 0 in the port \
    (adapters/adnuntius/adnuntius_utils.go:67-68, 99), and the `lastUpdated` of \
    `/currency/rates` (endpoints/currency_rates.go:49); and the staleness of the currency rates \
    across a clock step"""
pin = "crates/util/tests/timeutil.rs::now_is_the_utc_wall_clock"
restore = "Read the local zone and keep a monotonic instant beside each reading; not planned."

