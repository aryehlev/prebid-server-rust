[[difference]]
id = "regex.syntax-edges"
category = "regex"
status = "ledgered"
title = "Go patterns the translation does not carry over, and forms and sizes the regex crate refuses"
go = """\
    `regexp.Compile` takes a repetition right after a flag group (`a(?i)*` repeats `a`) and \
    escapes of surrogate code points (`\\x{D800}`), compiles counted repetitions of up to \
    1,000 of any class (`\\pL{1000}`), capture names that start with a digit (`(?P<1a>x)`) or \
    are used twice, a flag repeated or set and cleared in one group (`(?ii)`, `(?i-i)`), \
    `\\p{Cs}` and groups nested up to 1,000 deep, and keeps a group repeated zero times \
    (`(a){0}b` has one subexpression, which never takes part)."""
rust = """\
    `goregex::compile` fails with `CompileError::Unsupported` for the first two; the regex \
    crate refuses a compiled program over its 10 MiB default, which `\\pL{1000}` and \
    `(?:\\pL{100}){10}` are, those names and flags, `\\p{Cs}` and groups nested more than 250 \
    deep (`CompileError::Crate`), and drops a group repeated zero times, so `(a){0}b` has no \
    capture group."""
who = ["none"]
visible_in = """\
    Nowhere: none of the 162 patterns of Prebid's code and static/bidder-params has such a \
    form, and adquery's pattern of `^` and the request ID (adapters/adquery/adquery.go:93) has \
    one only for a request ID that is itself such a pattern"""
pin = "crates/util/tests/goregex.rs::untranslated_forms"
restore = """\
    Translate the forms, rename the names, merge the flags, keep a group repeated zero times \
    and raise the limits when a Prebid pattern needs them; not planned."""

[[difference]]
id = "regex.unicode-version"
category = "regex"
status = "ledgered"
title = "Unicode classes and case folding: Go 1.26's tables are Unicode 15.0, the regex crate's 16.0"
go = """\
    `\\pL`, the other `\\p` classes and `(?i)` follow `unicode.Version` 15.0.0, where the \
    characters Unicode 16.0 added (U+1C89 CYRILLIC CAPITAL LETTER TJE among them) are \
    unassigned."""
rust = "regex-syntax's tables are Unicode 16.0.0's, so `\\pL` matches U+1C89 and `(?i)` folds it to U+1C8A."
who = ["none"]
visible_in = """\
    Nowhere: no Prebid pattern has a `\\p` class, and its four `(?i)` patterns are ASCII \
    literals"""
pin = "crates/util/tests/goregex.rs::unicode_16_letters"
restore = "Ship Unicode 15.0 tables; not planned."

[[difference]]
id = "task.missed-ticks"
category = "task"
status = "restored"
title = "Periodic tasks: Go's ticker drops the ticks a slow run misses, a tokio interval bursts to catch up"
go = """\
    `TickerTask` runs on a `time.Ticker`, whose one-tick channel drops the ticks a slow run \
    misses: the next run starts when the slow one ends, the one after on the original schedule \
    (util/task/ticker_task.go)."""
rust = """\
    A tokio `Interval` fires every missed tick at once by default \
    (`MissedTickBehavior::Burst`)."""
who = ["operator"]
visible_in = """\
    How often the currency rates, stored-request events and other periodic refreshes run after \
    a slow one"""
pin = "crates/util/tests/task.rs::missed_ticks"
restore = """\
    pbs-util's `TickerTask` drives `interval_at` with `MissedTickBehavior::Skip` (crate \
    configuration, no glue). tokio drops a tick only once it is more than 5 ms late, so with an \
    interval of 5 ms or less a run that outlasts a tick by at most 5 ms is followed by a \
    catch-up run; Prebid's intervals are seconds or more."""
rule_b = "prebid-logic"

[[restoration]]
id = "task.missed-ticks"
pin = "crates/util/tests/task.rs::missed_ticks"
note = """\
