[[difference]]
id = "rand.sequences"
category = "rand"
status = "ledgered"
title = "Random numbers: rand's sequences, not `math/rand`'s"
go = """\
    `randomutil.RandomNumberGenerator` draws from the process-wide `math/rand` source, which Go \
    seeds randomly at start-up."""
