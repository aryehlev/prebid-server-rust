category = "ip"
status = "ledgered"
title = "Networks: Go prints a mapped network as the IPv4 network it maps and masks with any bytes, ipnet does neither"
go = """\
    `IPNet.String` writes a network in IPv4-mapped form in its 4-byte form \
    (`::ffff:10.0.0.0/104` as `10.0.0.0/8`), and `IP.Mask` and a hand-built `IPNet` take masks \
    whose ones do not all lead (`255.0.255.0`) and masks of other lengths."""
rust = """\
    ipnet writes `::ffff:10.0.0.0/104`, and its networks and `iputil::net::mask` hold prefix \
    masks of 32 or 128 bits only."""
who = ["none"]
visible_in = """\
    Nowhere: Prebid prints no network and makes masks with `net.CIDRMask` and networks with \
    `net.ParseCIDR` only (privacy/scrubber.go, config/requestvalidation.go)"""
pin = "crates/util/src/iputil/tests.rs::net_parse_cidr_golden"
restore = "A network type of Go's 4- and 16-byte forms; not planned."

[[difference]]
id = "ip.parse-edges"
category = "ip"
status = "restored"
title = "Addresses and networks: IPv4-mapped addresses and zero-padded prefixes, which Go reads and std and ipnet do not"
go = """\
    `net.ParseIP` returns 16 bytes for every address, so `IP.String`, `IP.Mask` and \
    `IPNet.Contains` treat `::ffff:10.1.2.3` as `10.1.2.3`, and `net.ParseCIDR` takes a prefix \
    with any number of leading zeros (`10.0.0.0/008`) and refuses octets with one \
    (`010.0.0.0/8`)."""
rust = """\
    std parses `::ffff:10.1.2.3` as an IPv6 address, which std writes as `::ffff:10.1.2.3` and \
    no IPv4 network of ipnet contains; ipnet's `IpNet::from_str` takes octets with a leading \
    zero and refuses an IPv4 prefix of more than two digits and an IPv6 one of more than \
    three."""
who = ["publisher", "bidder"]
visible_in = """\
    `device.ip` from a dual-stack proxy, as the private-network check (`request_validation`) and \
    the masking of `privacy.scrubIP` see it in bidder requests, and an operator's \
    `request_validation` networks"""
pin = "crates/util/tests/iputil.rs::edge_list"
restore = """\
    `pbs_util::iputil::net` parses addresses with std and keeps an IPv4-mapped one as the IPv4 \
    address it maps, and parses networks with std's address and Go's `dtoi` prefix into ipnet's \
    networks."""
rule_b = "a"

