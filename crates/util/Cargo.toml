[package]
name = "pbs-util"
description = "Ports of Prebid Server Go util packages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
publish.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
pbs-gocompat = { path = "../gocompat", version = "0.1.0" }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tokio = { version = "1.50.0", default-features = false, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.50.0", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
