[package]
name = "pbs-util"
description = "Ports of Prebid Server Go util packages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
publish.workspace = true
categories.workspace = true

[lints]
workspace = true

# std::net with ipnet for addresses and networks; percent-encoding sets for Go's url escapes;
# regex behind goregex's RE2 translation; rand and uuid for randomutil and uuidutil; the time
# crate for timeutil's layouts and clock and the task intervals; tokio for the tickers.
[dependencies]
ipnet = { workspace = true }
percent-encoding = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
pbs-devtools = { path = "../devtools", version = "0.1.0" }
tokio = { workspace = true, features = ["test-util"] }
