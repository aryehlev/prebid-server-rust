[[difference]]
id = "regex.unicode-classes"
category = "regex"
status = "restored"
title = "`\\d`, `\\w`, `\\s` and `\\b`: ASCII-only in Go's regexp, Unicode-aware in the regex crate"
go = "`\\d`, `\\w`, `\\s` and `\\b` are ASCII-only in Go's `regexp`, and Go has no `(?-u)` flag."
rust = """\
    The regex crate's classes are Unicode-aware unless the pattern says `(?-u:\\d)`: Arabic-Indic \
    digits, accented and CJK letters, a no-break space and an em space match where Go's do not, \
    and `\\b` sees no boundary between an accented letter and `foo`."""
who = ["publisher", "bidder"]
visible_in = """\
    Bidder-params validation (static/bidder-params patterns such as visx's `^\\d+$`), the \
    adapters' patterns and the sync URL macros"""
pin = "crates/differences/tests/regex.rs::go_difference_unicode_classes"
restore = """\
    UTIL-CRATES: `pbs_util::goregex` translates the classes, so Prebid's own patterns, in code \
    and in static/bidder-params, keep Go's meaning."""
rule_b = "d"
restore_by = ["UTIL-CRATES"]

[[difference]]
id = "server.cors-actual-requests"
category = "server"
status = "ledgered"
title = """\
    CORS on other requests: tower-http writes credentials on every answer, the origin for any \
    method and a three-name Vary"""
go = """\
    rs/cors, as `router.SupportCORS` configures it (router/router.go:377-385), writes `Vary: \
    Origin` on every answer that is not a preflight, and `Access-Control-Allow-Origin` and \
    `Access-Control-Allow-Credentials: true` only when the request has an Origin and a method it \
    allows (GET, POST and HEAD, and OPTIONS always); an OPTIONS without \
    `Access-Control-Request-Method` goes on to the router."""
rust = """\
    tower-http's CorsLayer writes `access-control-allow-credentials: true` on every answer, \
    server-to-server POSTs with no Origin included, `access-control-allow-origin` whatever the \
    method (PUT too), and `vary: origin, access-control-request-method, \
    access-control-request-headers`; it answers every OPTIONS itself as a preflight, so that \
    request never reaches the handler."""
who = ["publisher", "operator"]
visible_in = "The headers of every response"
pin = "crates/differences/tests/server.rs::go_difference_actual_request_headers"
note = """\
    These patterns also take the same headers of preflight answers (`server.cors-preflight`). \
    Go's router answers an OPTIONS without `Access-Control-Request-Method` itself, with an \
    `Allow` header (httprouter v1.3.0's router.go:422-425); the Rust server answers it as a \
    preflight, so the `Allow` pattern takes that header, on OPTIONS cases only."""

[[difference.harness]]
kind = "header"
path = "$['@headers']['Access-Control-Allow-Credentials']"

[[difference.harness]]
kind = "header"
path = "$['@headers']['Access-Control-Allow-Origin']"

[[difference.harness]]
kind = "header"
path = "$['@headers'].Allow"
input = "options_request"

[[difference.harness]]
kind = "header"
path = "$['@headers'].Vary"

[[difference]]
id = "server.cors-preflight"
category = "server"
status = "ledgered"
title = """\
    CORS preflights: rs/cors answers 204 with the requested method and headers, tower-http 200 \
    with its configured lists"""
go = """\
    rs/cors answers a preflight with 204: `Access-Control-Allow-Origin` (the origin), \
    `Access-Control-Allow-Credentials: true`, `Access-Control-Allow-Methods` echoing the \
    requested POST, `Access-Control-Allow-Headers` echoing the requested headers, and `Vary: \
    Origin, Access-Control-Request-Method, Access-Control-Request-Headers`. When a requested \
    header is not allowed (`x-custom`), it answers 204 with only that Vary."""
rust = """\
    tower-http's CorsLayer answers 200 every time, with `GET,POST,HEAD`, \
    `origin,x-requested-with,content-type,accept` and a lower-case `vary`, a disallowed requested \
    header included. The browser's verdict is the same in all three cases."""
who = ["publisher"]
visible_in = "Answers to CORS preflights on every endpoint"
pin = "crates/differences/tests/server.rs::go_difference_preflight_status_and_headers"
restore = """\
    A CORS layer of our own that answers as rs/cors does; not planned (orchestrator ruling 5 \
    accepts and ledgers the difference)."""

[[difference.harness]]
kind = "status"
path = "$['@status']"
input = "options_request"

[[difference.harness]]
kind = "header"
path = "$['@headers']['Access-Control-Allow-Headers']"
input = "options_request"

[[difference.harness]]
kind = "header"
path = "$['@headers']['Access-Control-Allow-Methods']"
input = "options_request"

[[difference]]
id = "time.rfc3339-fraction"
category = "time"
status = "restored"
title = """\
    RFC 3339 times: Go's RFC3339 layout writes whole seconds, the time crate's `Rfc3339` the \
    fraction"""
go = """\
    The `time.RFC3339` layout writes whole seconds (`2026-11-18T10:20:30Z`), and \
    `time.RFC3339Nano` the fraction without trailing zeros."""
rust = """\
    The time crate's well-known `Rfc3339` writes the fraction whenever there is one, as \
    `RFC3339Nano` does, so whole seconds need a format description of their own."""
who = ["publisher", "analytics"]
visible_in = """\
    Times Prebid formats with the RFC3339 layout, such as the last-modified parameter of \
    stored-request event polling (stored_requests/events/http/http.go:127)"""
pin = "crates/differences/tests/time.rs::go_difference_rfc3339_fraction"
restore = """\
    UTIL-CRATES: format descriptions for the RFC3339 and RFC3339Nano layouts Prebid's code picks. \
    This is Prebid's formatting choice ported in place, as ruling 4 does for floats; the uids \
    cookie's times are Rule B (b)."""
rule_b = "prebid-logic"
restore_by = ["UTIL-CRATES"]

[[difference]]
id = "url.host-normalization"
category = "url"
status = "ledgered"
title = "URL hosts: Go's `url.Parse` keeps the host as written, the url crate normalises it"
go = """\
    `url.Parse` keeps `Host` as written (`Example.COM:80`) and a non-ASCII host as it came, which \
    `String()` percent-encodes; `site.domain` takes the referrer's `Host`, port included \
    (endpoints/openrtb2/auction.go:1606-1608)."""
rust = """\
    The url crate (WHATWG) lower-cases the host, drops the scheme's default port and writes a \
    non-ASCII host in IDNA form."""
who = ["bidder", "publisher"]
visible_in = "`site.domain` and the other values Prebid takes from a URL's host, in bidder requests"
pin = "crates/differences/tests/url.rs::go_difference_url_host_normalization"
restore = """\
    A Go-style URL parser for the URLs Prebid writes back; not planned (orchestrator rulings, \
    2026-11-19)."""

[[difference]]
id = "yaml.bool-case"
category = "yaml"
status = "ledgered"
title = "YAML 1.1 booleans: yaml.v3 takes three spellings of each word, serde-saphyr any case"
go = """\
    yaml.v3 decodes into a `bool` only `y`, `Y`, `yes`, `Yes`, `YES`, `on`, `On`, `ON`, `true`, \
    `True` and `TRUE`, and the false forms in the same spellings; mixed case (`yEs`, `oN`, \
    `tRue`, `fAlse`) fails the load (config/bidderinfo.go:323)."""
rust = """\
    serde-saphyr matches the words in any case, so a mixed-case value that fails Go's load loads \
    here. `1`, `0`, `t` and `f` fail on both sides."""
who = ["operator"]
visible_in = """\
    Startup with a bidder-info YAML file (static/bidder-info) that spells a boolean in mixed case"""
pin = "crates/differences/tests/yaml.rs::go_difference_boolean_case"
