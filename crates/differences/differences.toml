go = """\
    `publicsuffix.EffectiveTLDPlusOne` (x/net v0.55.0) fails on a host with an empty label (a \
    trailing dot, a leading dot, two dots in a row) and on a bare IP address, which \
    `PublicSuffix` returns whole, so the auction leaves `site.publisher.domain` unset for such a \
    referrer (endpoints/openrtb2/auction.go:1607-1611)."""
rust = """\
    `psl::domain_str` answers `example.com` for `example.com.`, `www.example.com.` and \
    `.example.com`, `.com` for `example..com`, `example.co.uk` for `a..b.example.co.uk` and `1.1` \
    for `192.168.1.1`, so the domain is set. Both answer `1.1:8080` for `192.168.1.1:8080`, and \
    neither finds a domain in `[::1]:8080`."""
who = ["bidder", "publisher", "analytics"]
visible_in = """\
    `site.publisher.domain` in bidder requests and analytics, for referrers whose host has an \
    empty label or is an IPv4 address"""
pin = "crates/differences/tests/psl.rs::go_difference_empty_labels_and_ip_addresses"
restore = """\
    Check the host for empty labels and parse it as an IP address before calling psl, leaving the \
    domain unset where Go's lookup fails."""
default = "psl's answer, so the domain is set where Go leaves it unset (crates first)."
decision = "D-PSL"
rule_b = "a"

