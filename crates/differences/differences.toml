# The differences ledger's entries for the library pins in tests/ (see the pbs_differences
# ledger module for the schema). pbs-differences validates this file and writes
# docs/DIFFERENCES.md and docs/differences.json from it; run
#   cargo run -p pbs-differences --locked --offline -- --write
# after a change. A restored entry's restore pin lands with the unit restore_by names, as a
# [[restoration]] table in that crate's own differences.toml.

[[difference]]
id = "cache.large-entries"
category = "cache"
status = "ledgered"
title = "Large stored-data entries: freecache refuses them, moka keeps them"
go = """\
    freecache refuses an entry whose key and value together are longer than 1/1024 of the cache \
    less its 24-byte entry header (`ErrLargeEntry`, whose text says only 1/1024; freecache's \
    segment.go:73-76): a 1 MiB cache keeps a 993-byte document under a 7-byte key, 1000 bytes in \
    all, and refuses a 994-byte one. Prebid logs the error and drops the entry \
    (stored_requests/caches/memory/maps.go:60-64), so such a document is fetched again on every \
    request."""
rust = """\
    moka, bounded by the same byte budget through a weigher, keeps every entry that fits the \
    budget."""
who = ["operator"]
visible_in = """\
    Fetches and error logs of the stored request, imp, response and account caches when a \
    document is larger than 1/1024 of its in-memory cache"""
pin = "crates/differences/tests/cache.rs::go_difference_large_entries_admitted"

[[difference]]
id = "config.env-bool-spellings"
category = "config"
status = "restored"
title = """\
    Boolean `PBS_` variables: Viper converts them with `cast.ToBool`, the config crate with its \
    own spellings"""
go = """\
    For a key with a bool default, Viper converts a `PBS_` value with `cast.ToBool` \
    (`SetTypeByDefaultValue`, config/config.go:1319), which is `strconv.ParseBool` with its error \
    dropped: `1`, `t`, `T`, `true`, `TRUE` and `True` are true, and every other value (`tRuE`, \
    `yes`, `YES`, `on`, `y`, `maybe` and the false forms) is false, never an error. A key bound \
    only with `BindEnv` goes through mapstructure's weak decode: `ParseBool`, the empty string is \
    false, and anything else fails the load (orchestrator ruling 8)."""
rust = """\
    The config crate takes `1`, `true`, `on` and `yes` and their false forms (`0`, `false`, \
    `off`, `no`) in any case, and fails the load on `t`, `T`, `f`, `F`, `y`, `n` and `maybe`."""
who = ["operator"]
visible_in = "Startup with `PBS_` environment variables that set boolean keys"
pin = "crates/differences/tests/config.rs::go_difference_env_bool_spellings"
restore = """\
    CONFIG-LOADER converts as Viper does: `cast.ToBool` for keys with a bool default, and \
    mapstructure's weak decode for keys bound only with `BindEnv` (`adapters.<bidder>.disabled`, \
    `.debug.allow`, `.experiment.adsCert.enabled`, `.modifyingVastXmlAllowed`, \
    `account_defaults.privacy.dsa.gdpr_only` and the others the defaults table marks), each path \
    against a Go golden of its own (orchestrator ruling 8)."""
rule_b = "c"
restore_by = ["CONFIG-LOADER"]

