[[difference]]
id = "json.raw-not-compacted"
category = "json"
status = "restored"
title = "`json.RawMessage` on write: Go compacts it, serde_json writes a `RawValue` as it was read"
go = """\
    `jsonutil.Marshal` writes a `json.RawMessage` through Prebid's `RawMessageExtension` \
    (registered at main.go:23-25), which runs `json.Compact`: whitespace goes, nothing is \
    escaped, and for bytes that are not JSON nothing is written and no error returned, so the \
    output (`{\"id\":\"1\",\"ext\":}`) is not JSON. `json.Marshal` and the endpoints' Encoders \
    compact it too, HTML-escaping inside it unless `SetEscapeHTML(false)`, and fail on bytes that \
    are not JSON (`error calling MarshalJSON for type json.RawMessage: unexpected end of JSON \
    input`)."""
rust = """\
    A `RawValue` is written as it was read, whitespace included, and serde_json cannot build one \
    from bytes that are not JSON."""
who = ["bidder", "publisher"]
visible_in = "Ext members and other raw JSON in bidder request bodies and in responses"
pin = "crates/differences/tests/json.rs::go_difference_raw_message_not_compacted"
restore = """\
    JSONUTIL: `raw_compact`, the equivalent of Prebid's own `RawMessageExtension`, which typegen \
    puts on every `json.RawMessage` field. This is Prebid logic, not library glue; the escaping \
    inside stays `json.html-escape`."""
rule_b = "prebid-logic"
restore_by = ["JSONUTIL"]

