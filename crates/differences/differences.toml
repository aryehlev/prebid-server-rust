[[difference]]
id = "json.float-format"
category = "json"
status = "ledgered"
title = """\
    Float spelling: Go writes `1`, `300` and `1e-07` where serde_json writes `1.0`, `300.0` and \
    `1e-7`"""
go = """\
    strconv's shortest form, plain for `1e-6 <= |f| < 1e21` (1e20 is `100000000000000000000`) and \
    with an exponent otherwise, which jsoniter (`jsonutil.Marshal`) writes `1e-07` and \
    `encoding/json` (`json.Marshal` in 222 adapter files, the endpoints' Encoders) `1e-7`. A \
    float32 is written at 32 bits, an integral value has no fraction (`1`, `300`) and -0 stays \
    `-0`. A number read into `interface{}` is a float64: `12345678901234567890` comes back as \
    `12345678901234567000`, and `300.0` and `1E2` as `300` and `100`."""
rust = """\
    serde_json writes `1.0`, `300.0`, `123456789.0` and `1e+20`; an f64 0.000001 is `1e-6` and an \
    f32 one `0.000001`, and -0 is `-0.0`. A `serde_json::Value` keeps integers exact and floats \
    as f64: `300.0`, `100.0`, `1e-6`, `-0.0`."""
who = ["publisher", "bidder", "analytics"]
visible_in = """\
    Prices and other floats in response bodies, bidder request bodies, analytics and cache \
    payloads"""
pin = "crates/differences/tests/json.rs::go_difference_float_formatting"
restore = """\
    A serde_json Formatter overriding `write_f64` and `write_f32`; not planned (orchestrator \
    ruling 2)."""
note = """\
    Floats Prebid prints into its own text (targeting values, macros) use the precision Prebid's \
    Go code uses, which is Prebid logic ported in place (orchestrator ruling 4), not this entry."""

[[difference.harness]]
kind = "lexical"
lexical_class = "number_format"
path = "$.**"

[[difference]]
id = "json.html-escape"
category = "json"
status = "ledgered"
title = "HTML escaping: Go writes `<`, `>` and `&` as `\\u` escapes, serde_json as they are"
go = """\
    `jsonutil.Marshal` (jsoniter's `ConfigCompatibleWithStandardLibrary`), `json.Marshal` and \
    Encoders with default settings write `<`, `>` and `&` in strings as `\\u003c`, `\\u003e` and \
    `\\u0026`, and U+2028 and U+2029 as `\\u2028` and `\\u2029`. Inside a `json.RawMessage` only \
    `json.Marshal` and such Encoders escape: `jsonutil.Marshal` writes one through the \
    `RawMessageExtension` main.go:23-25 registers, which compacts it and escapes nothing \
    (`json.raw-not-compacted`). The endpoints' Encoders turn HTML escaping off \
    (`SetEscapeHTML(false)` at endpoints/openrtb2/auction.go:384, \
    endpoints/openrtb2/amp_auction.go:408, endpoints/cookie_sync.go:561 and \
    exchange/exchange.go:986) and still escape U+2028 and U+2029 in strings."""
rust = """\
    serde_json writes all five characters as they are. Strings the endpoints' Encoders write \
    themselves, such as a bid's `adm`, differ only in U+2028 and U+2029; the `<`, `>` and `&` \
    differences sit in what `jsonutil.Marshal` and `json.Marshal` wrote: ext members, adapter \
    request bodies and cache payloads."""
who = ["publisher", "bidder", "operator"]
visible_in = "Response bodies, bidder request bodies and Prebid Cache payloads"
pin = "crates/differences/tests/json.rs::go_difference_no_html_escaping"
restore = "A serde_json Formatter that adds Go's escapes; not planned (D-HTMLESC)."
decision = "D-HTMLESC"
note = """\
    The `unicode_escape` pattern also takes the control-character spellings of \
    `json.control-escapes`."""

[[difference.harness]]
kind = "lexical"
lexical_class = "html_escape"
path = "$.**"

[[difference.harness]]
kind = "lexical"
lexical_class = "unicode_escape"
path = "$.**"

