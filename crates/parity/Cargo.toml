[package]
name = "pbs-parity"
description = "Parity-harness seams: stage traces, decisions, fakes and orders (feature trace)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
publish.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# Parity mode: a process-wide case session records traces, decisions read the envelope, and the
# deterministic fakes can be installed. Off by default; without it every seam is a no-op.
trace = ["dep:pbs-jsonutil", "dep:pbs-metrics", "dep:tokio"]

[dependencies]
base64 = { workspace = true }
flate2 = { workspace = true }
pbs-errortypes = { path = "../errortypes", version = "0.1.0" }
# `jsonutil.Marshal`, which Go's trace session writes recorded values and analytics objects with.
pbs-jsonutil = { path = "../jsonutil", version = "0.1.0", optional = true }
pbs-metrics = { path = "../metrics", version = "0.1.0", optional = true }
pbs-util = { path = "../util", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# The instants of pbs-util's `timeutil::Time`, which the fakes' `Source` implements.
time = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
