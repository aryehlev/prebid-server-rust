[package]
name = "pbs-metrics"
description = "Prebid Server metrics engine with Go-identical metric names and labels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
publish.workspace = true
categories.workspace = true

[lints]
workspace = true

# prometheus holds the Prometheus engine's registry. The go-metrics engine logs through
# pbs-logger, and the go-metrics library's samples draw from rand.
[dependencies]
pbs-logger = { path = "../logger", version = "0.1.0" }
prometheus = { workspace = true }
rand = { workspace = true }
