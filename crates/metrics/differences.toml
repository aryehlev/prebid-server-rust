[[difference]]
id = "influx.write-request"
category = "influx"
status = "ledgered"
title = """\
    InfluxDB writes: influxdb1-client's query, headers and comment lines, against influxdb \
    0.8.0's"""
go = """\
    `Client.Write` posts to `<path>/write?consistency=&db=<db>&precision=&rp=`, sorted and \
    beside the host URL's own query pairs, with an empty `Content-Type`, and ends every line \
    with a newline; it writes a point with a NaN or infinite field, an empty field name, a key \
    over 65535 bytes or a time outside 1677 to 2262 as a `# ERROR: <reason> <measurement>` \
    comment line, leaves out a zero time and writes a time before 1970 as negative \
    nanoseconds (influxdb.go:294-346, :642-646)."""
rust = """\
    influxdb 0.8.0 posts `?db=<db>&precision=ns` in its hash map's order (`precision=ms` for \
    an empty batch, which hyper sends without a `Content-Length`), with reqwest's \
    `Accept: */*` and no `Content-Type`, and joins the lines without a final newline; it writes \
    every point as a line, a non-finite field as `NaN`, `inf` or `-inf`, and the reporter \
    writes a time before 1970 as 0."""
who = ["operator"]
visible_in = """\
    The reporter's write requests, and its batches with a point InfluxDB refuses: a metric name \
    of some 64 KiB (an account id that long), or a clock outside 1970 to 2262"""
pin = "crates/metrics/tests/influx.rs::write_request"
restore = """\
    Write the requests and lines with reqwest from a writer of the reporter's own, the fallback \
    D-INFLUX names; not planned: the server reads both requests alike."""
decision = "D-INFLUX"
note = """\
    crates/metrics/tests/influx.rs::points_match_go finds every point of points.txt Go writes \
    spelled alike, the ledgered escapes and times aside, and a line of the crate's for every \
    point Go refuses."""

[[difference]]
id = "influx.write-status"
category = "influx"
status = "ledgered"
title = """\
    InfluxDB write answers: Go succeeds on 200 and 204 alone, influxdb 0.8.0 on any 2xx whose \
    body names no error"""
go = """\
    A write succeeds on a 200 or a 204, whatever the body, and fails on any other status \
    (influxdb.go:360-364)."""
rust = """\
    influxdb 0.8.0 succeeds on any 2xx status unless the body holds `"error"` or `"Error"`, \
    quotes included: a 201 or 202 succeeds, and a 200 that names an error fails."""
who = ["operator"]
visible_in = """\
    The reporter's `unable to send metrics` log lines, for a server or proxy that answers a \
    write with another 2xx status or with a 200 that names an error"""
pin = "crates/metrics/tests/influx.rs::write_status"
restore = """\
    Write with reqwest and check Go's statuses, the fallback D-INFLUX names; not planned: \
    InfluxDB answers a write with 204, or with 4xx or 5xx when it fails."""

[[difference]]
id = "influx.error-texts"
category = "influx"
status = "ledgered"
title = "InfluxDB errors: the reporter logs the crate's, reqwest's and the url crate's texts"
go = """\
    A write that fails on its status is the answer's body read as a `fmt.Errorf` format \
    (`%!d(MISSING) oops`); one that fails to send is net/http's `Post "<url>": <reason>`, a \
    failed ping `Get "<url>": <reason>`, and a host `url.Parse` refuses \
    `parse "<host>": <reason>` (influxdb.go:348-364; go-metrics-influxdb influxdb.go:35-37)."""
rust = """\
    `API error with a status code: <status>` whatever the body, `connection error: <reqwest's \
    text>`, `http protocol error: ...` or `InfluxDB encountered the following error: ...` for \
    a write, reqwest's `error sending request for url (<url>)` for a ping, and the url crate's \
    reason, such as `relative URL without a base`, for a host."""
who = ["operator"]
visible_in = "The `err=` part of the reporter's log lines"
pin = "crates/metrics/tests/influx.rs::error_texts"
restore = """\
    Map the crate's and reqwest's errors to Go's texts; not planned: the texts are not \
    Prebid's, and Go's reads the server's body as a format."""
note = """\
    crates/metrics/tests/influx.rs::reporter_matches_go finds the reporter's log lines Go's up \
    to their `err=`."""

[[difference]]
id = "influx.host-url"
category = "influx"
status = "ledgered"
title = """\
    `metrics.influxdb.host`: Go's `url.Parse` and `path.Join`, against the url crate and \
    influxdb 0.8.0's `<host>/write`"""
go = """\
    `url.Parse` accepts `localhost`, `//influx/p`, a zone such as `[fe80::1%25en0]`, a port \
    over 65535, `h:8086:8086` and `user@:80`, and refuses `%61` or `%41` in a host, `%zz` in a \
    path or fragment, control characters and a leading space; the writes go to \
    `path.Join(path, "write")`, repeated slashes collapsed and `%2F` decoded, with the host \
    URL's query beside Go's own pairs, and the pings to `<path>/ping` with the query \
    (influxdb.go:296, :341-346 and :421)."""
rust = """\
    The url crate refuses the first hosts, so the reporter logs `unable to parse InfluxDB url` \
    once and stops, and reads the second ones (`ex%61mple.com` as `example.com`, a trailing \
    newline or a leading space dropped); it lowercases hosts, reads `http:///p` as the host \
    `p` and writes international names in punycode. The writes go to `<path>/write` with the \
    repeated slashes and `%2F` kept and without the host URL's query; the pings keep it."""
who = ["operator"]
visible_in = """\
    Whether the reporter starts and where it writes, for hosts spelled as above, with a path \
    that holds `//` or `%2F`, or with a query"""
pin = "crates/metrics/tests/influx.rs::host_url"
restore = """\
    Read the host with a port of `url.Parse` and post to Go's path and query; not planned: \
    such hosts are misconfigurations."""

[[difference]]
id = "influx.key-escapes"
category = "influx"
status = "ledgered"
title = """\
    Line-protocol escapes: influxdb1-client's and influxdb 0.8.0's differ on backslashes and \
    double quotes"""
go = """\
    influxdb1-client unescapes a backslash before a comma or space in the measurement, then \
    escapes its commas and spaces; it escapes commas, spaces and `=` in tag keys and values, \
    and commas, double quotes, spaces and `=` in field keys (models/points.go:1225-1257, \
    pkg/escape/strings.go:6)."""
rust = """\
    influxdb 0.8.0 escapes the measurement's commas and spaces as written, field keys' commas, \
    spaces and `=` but not their double quotes, and tag values' backslashes and double quotes \
    as well."""
who = ["operator"]
visible_in = """\
    The lines of metrics whose names hold a double quote (an account id or a bidder alias with \
    one), and of a measurement with a backslash before a comma or space; the reporter's one \
    tag, `bucket`, holds neither"""
pin = "crates/metrics/tests/influx.rs::key_escapes"
restore = """\
    A writer of the reporter's own that escapes as Go does, the fallback D-INFLUX names; not \
    planned."""

[[difference]]
id = "influx.cadence"
category = "influx"
status = "ledgered"
title = "Reporter ticks: Go's `time.Tick` timers, against tokio intervals on a millisecond wheel"
go = """\
    The reporter sends at every `time.Tick(interval)` and pings at every `time.Tick(5 s)`, from \
    one period after it starts, on Go's runtime timers; a tick the loop is too busy to take \
    comes when it is free, the next one back on the period's grid (influxdb.go:70-91)."""
rust = """\
    tokio intervals with `MissedTickBehavior::Skip` tick alike, rounded up to tokio's \
    millisecond timer wheel; a tick at most 5 ms late is followed by the next one a period \
    after it, so a period of 5 ms or less can tick twice to catch up."""
who = ["none"]
visible_in = """\
    Nowhere: the periods are whole seconds (`metric_send_interval`) and 5 s, where only the \
    sub-millisecond time of a tick differs"""
pin = "crates/metrics/tests/influx.rs::cadence"
restore = "Not needed at whole-second periods."

