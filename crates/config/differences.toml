[[difference]]
id = "config.layering"
category = "config"
status = "restored"
title = """\
    Layers: Viper resolves each key over the defaults, the file and the environment, the config \
    crate merges its sources into one tree"""
go = """\
    Viper's `Get` takes a key from the environment, then the file, then the defaults \
    (viper.go:1220-1354): a `null` file value leaves the default (`port: ~` keeps 8000), and a \
    dotted key inside a section sets the key under it (`gdpr:` with `tcf2.enabled: false` sets \
    `gdpr.tcf2.enabled`)."""
rust = """\
    The config crate merges its sources into one tree, a later source's value replacing an \
    earlier one at its path, so a `null` replaces the default and fails the read; a dotted key \
    below the top level is a key of its own, so the default stays."""
who = ["operator"]
visible_in = """\
    Startup with a configuration that has `null` values or dotted keys inside sections, or \
    `PBS_` variables for sections"""
pin = "crates/config/tests/loader.rs::go_difference_layering"
restore = """\
    CONFIG-LOADER resolves each key as Viper's `find`, `IsSet`, `AllKeys` and `AllSettings` do \
    and decodes Viper's tree."""
rule_b = "c"

[[difference]]
id = "config.error-texts"
category = "config"
status = "ledgered"
title = "Config decode errors: mapstructure's words, with values printed as Rust prints them"
go = """\
    `config.New` wraps mapstructure's error as `viper failed to unmarshal app config: ...` \
    (config/config.go:758-760) and main.go:42 logs it fatally: mapstructure lists every field \
    that fails, sorted, as `2 error(s) decoding:` and lines such as `* cannot parse \
    'account_defaults.cookie_sync.max_limit' as int: strconv.ParseInt: parsing \"\\u00a0x\": \
    invalid syntax`, printing values with fmt's `%v` (`[1e+06 1e-05]`) and quoting strings with \
    `strconv.Quote`."""
rust = """\
    The loader gives the same wrapper and the same failures in the same order and words, but \
    prints a float as Rust spells it (`[1000000 0.00001]`), quotes a string as Rust quotes it \
    (`\"\\u{a0}x\"`), and lists the keys of a `map[interface{}]interface{}` value in the order \
    of their text."""
who = ["operator"]
visible_in = """\
    The startup error for a configuration whose values do not decode into \
    `config.Configuration`, where a value it prints holds a float Go prints with an exponent, a \
    character `strconv.Quote` escapes otherwise than Rust, or a map whose keys are not strings"""
pin = "crates/config/tests/loader.rs::go_difference_error_texts"
restore = """\
    Port fmt's `%v` and `strconv.Quote` with Go's Unicode tables; not planned (orchestrator \
    ruling 2 ledgers library error wording)."""
note = """\
    The wrapper is Prebid's text and stays exact (`error_wrapper_exact`), and the other decode \
    errors of `loads.json`, `matrix.json` and `scalars.json` are Go's texts but for the quoting \
    of the one `scalars.json` input holding U+00A0 and U+2003 \
    (`weak_decode_matches_mapstructure`)."""

[[difference]]
