# The differences ledger's entries of pbs-config, the configuration loader, and the restore pins
# it brings to entries recorded in crates/differences (see the pbs_differences ledger module for
# the schema). Run
#   cargo run -p pbs-differences --locked --offline -- --write
# after a change.

[[difference]]
id = "config.formats"
category = "config"
status = "ledgered"
title = "Config file formats: Viper reads twelve extensions, the loader JSON, TOML and YAML"
go = """\
    Viper looks for `pbs.<ext>` in `.` and then in `/etc/config` over `json`, `toml`, `yaml`, \
    `yml`, `properties`, `props`, `prop`, `hcl`, `tfvars`, `dotenv`, `env` and `ini` \
    (viper.go:419, viper_go1_15.go:16-45) and reads the first file found with that format's \
    reader (config/config.go:936-940)."""
rust = """\
    The loader searches the same way and reads JSON, TOML and YAML; when the first file found is \
    in another format, the load fails with an error that names the file and the formats it \
    reads."""
who = ["operator"]
visible_in = """\
    Startup with a pbs.properties, pbs.props, pbs.prop, pbs.hcl, pbs.tfvars, pbs.dotenv, pbs.env \
    or pbs.ini that Viper would read"""
pin = "crates/config/tests/loader.rs::unsupported_format_fails_loudly"
restore = """\
    Port the remaining readers (magiconair/properties, hashicorp/hcl, subosito/gotenv and \
    gopkg.in/ini.v1); not planned."""
decision = "D-VIPERFMT"

[[difference]]
id = "config.toml-reader"
category = "config"
status = "ledgered"
title = "pbs.toml dates and times: go-toml gives Go time types, the toml crate their text"
go = """\
    Viper reads pbs.toml with go-toml v2.0.1: an offset date-time is a `time.Time` and a local \
    date, time or date-time go-toml's `LocalDate`, `LocalTime` or `LocalDateTime`, which \
    mapstructure refuses for a string field (`expected type 'string', got unconvertible type \
    'time.Time'`) and the account modules hook writes as JSON. A file that does not parse is \
    ignored, with go-toml's error text, which Prebid drops (config/config.go:1322)."""
rust = """\
    The config crate's TOML reader (the toml crate) gives every date and time as its TOML text, \
    which a string field takes. A file that does not parse is ignored as in Go, with the toml \
    crate's error text."""
who = ["operator"]
visible_in = "Startup with a pbs.toml that holds a date or time value"
pin = "crates/config/tests/loader.rs::toml_reads_like_go_toml"
restore = "Port go-toml v2.0.1's date and time types; not planned."
decision = "D-VIPERFMT"

[[difference]]
id = "config.json-reader"
category = "config"
status = "ledgered"
title = """\
    pbs.json: encoding/json reads documents serde_json refuses, and the two word their errors \
    each their own way"""
go = """\
    Viper reads pbs.json with encoding/json into `map[string]interface{}`, every number a \
    `float64`: invalid UTF-8 and a lone surrogate escape each become U+FFFD, and 200 levels of \
    nesting read (encoding/json takes 10000). A file that does not parse is ignored with \
    encoding/json's error (`unexpected end of JSON input`), which Prebid drops \
    (config/config.go:1322)."""
rust = """\
    The loader reads pbs.json with serde_json, every number a `float64` too: a document holding \
    invalid UTF-8 or a lone surrogate escape, or nesting 128 levels or more, does not parse, so \
    the file is ignored and the defaults stay; a file neither reads is ignored with serde_json's \
    error (`EOF while parsing an object at line 1 column 13`)."""
who = ["operator"]
visible_in = """\
    Startup with a pbs.json that holds invalid UTF-8 or a lone surrogate escape, or nests 128 \
    levels or more: its settings are not applied"""
pin = "crates/config/tests/loader.rs::go_difference_json_reader"
restore = """\
    Rewrite lone surrogate escapes with pbs-jsonutil's `replace_lone_surrogates` before \
    serde_json reads the file (orchestrator ruling 7), once pbs-config's base holds pbs-jsonutil; \
    invalid UTF-8 and the depth stay as D-DECODE leaves them for requests (json.invalid-utf8, \
    json.nesting-depth)."""
note = """\
    json.lone-surrogates restores lone surrogates where Go decodes request-time input; this \
    unit's base predates the JSONUTIL merge that holds the rewrite."""

[[difference]]
id = "config.module-json"
category = "config"
status = "ledgered"
title = """\
    Account module config bytes: jsonutil.Marshal escapes HTML and spells floats as strconv \
    does, serde_json writes its own way"""
go = """\
    `AccountModulesHookFunc` marshals each module's configuration with `jsonutil.Marshal` into a \
    `json.RawMessage` (config/account_module_decoder.go:16-61): keys sorted, `<`, `>` and `&` as \
    `\\u003c`, `\\u003e` and `\\u0026`, and floats as strconv spells them: `3` for 3.0, \
    `100000000000000000000` for 1e20, `1e-07` and `-0` (`1e+21` as serde_json writes it)."""
rust = """\
    The loader writes the bytes with serde_json: keys sorted, and a whole float that fits an i64 \
    or a u64 as the integer Go writes (`3`, `12345678901234567000`), but the characters as they \
    are and the other floats in serde_json's spelling (`1e+20`, `1e-7`); -0 is `0`."""
who = ["none"]
visible_in = """\
    Only the bytes a module receives for `account_defaults.hooks.modules`: a module that parses \
