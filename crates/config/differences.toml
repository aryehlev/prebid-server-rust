[[difference]]
id = "config.key-unicode"
category = "config"
status = "ledgered"
title = "Key case: Go maps letters by Unicode 15.0.0, the loader by std's later Unicode tables"
go = """\
    Viper lower-cases the keys of the configuration file and upper-cases the `PBS_` names with \
    `strings.ToLower` and `strings.ToUpper` (viper.go insensitiviseMap and mergeWithEnvPrefix, \
    v1.12.0), and mapstructure matches keys to fields with `strings.EqualFold`; go1.26.2's tables \
    are Unicode 15.0.0's, so a letter whose case pair a later version added, such as U+A7CB, \
    U+10D50 or U+1C89, stays as it is."""
rust = """\
    The loader maps each character by its simple mapping as Go does, from std's tables, which \
    are a later Unicode version's: those letters map to their pairs (U+A7CB to U+0264, U+10D50 \
    to U+10D70, U+1C89 to U+1C8A)."""
who = ["operator"]
visible_in = """\
    A key of the configuration file, such as a module's setting under `hooks.modules`, that \
    holds a letter Unicode gave a case pair after 15.0.0"""
pin = "crates/config/src/loader/tests.rs::case_mapping_matches_go"
restore = "Carry Unicode 15.0.0's case tables for keys; not planned."

[[difference]]
id = "yaml.scalars"
category = "yaml"
status = "ledgered"
title = "YAML scalars: yaml.v3 and serde-saphyr resolve some plain scalars to different types"
go = """\
    yaml.v3 v3.0.1 parses integers with `strconv.ParseInt` base 0, so `0X1F`, `0O17`, `0B101`, \
    `1_` and `1__0` are numbers, and floats after removing underscores (`1_000.5`); it keeps an \
    out-of-range float such as `1e400` a string, makes YAML 1.1 timestamps such as `2001-12-14` \
    `time.Time` (a string key then gets `2001-12-14 00:00:00 +0000 UTC`), keeps the text of a \
    scalar with a custom tag, and fails on `!!null x`."""
rust = """\
    serde-saphyr keeps those numbers and timestamps strings, reads `1e400` as infinity, resolves \
    a scalar with a custom tag as if untagged (`!e!x 1` is the number 1) and reads `!!null x` as \
    null."""
who = ["operator"]
visible_in = """\
    Startup with a pbs.yaml that writes such a scalar; none of the 398 bidder-info files of the \
    pinned upstream does"""
pin = "crates/config/tests/yaml.rs::scalars_resolve_like_yaml_v3"
restore = "Resolve plain scalars from serde-saphyr's events with yaml.v3's rules; not planned."

