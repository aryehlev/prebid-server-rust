restore = """\
    Write the bytes with Go's escaping and float spelling, which json.html-escape and \
    json.float-format leave as they are; not planned."""

[[difference]]
id = "config.map-order"
category = "config"
status = "ledgered"
title = "Map order in the config tree: Go's varies from run to run, the loader's is sorted"
go = """\
    Where `AllSettings` writes a key and a key under it (a file value under a key with a \
    default, such as `port:` with `a: 1` below it, or `{a: 1}` for a list key) or a `null` file \
    section with `PBS_` variables under it, the tree it builds and the decode of it depend on the \
    order Go iterates a map in, which varies from run to run (viper.go:1940-1957 and 2021-2038). \
    So does the vendor the account modules hook names when several modules do not marshal \
    (config/account_module_decoder.go:16-50)."""
rust = """\
    The loader takes the keys in sorted order, which gives one of Go's outcomes, the same on every \
    run."""
who = ["operator"]
visible_in = """\
    Startup with a configuration that gives a key a value and keys under it, or a null section \
    with `PBS_` variables under it, and the startup error for account modules of which several \
    do not marshal"""
pin = "crates/config/tests/loader.rs::map_order_is_sorted"
restore = "None: any one order is an order Go can take."

[[difference]]
id = "config.weak-typing"
category = "config"
status = "restored"
title = """\
    Config values into typed fields: Viper casts by the default's type and mapstructure decodes \
    weakly, the config crate converts by the type serde asks for"""
go = """\
    Viper casts a value with spf13/cast by the type of the key's default \
    (`SetTypeByDefaultValue`, config/config.go:1319), dropping cast's error, and `v.Unmarshal` \
    decodes the tree with mapstructure's `WeaklyTypedInput` and `AccountModulesHookFunc` \
    (config/config.go:758): `0x10` is 16, `4x2` is 0 for a key with a default, 4.5 is 4, a \
    scalar is a one-element list, a list of maps merges into a map, and a number is cut to the \
    field's size."""
rust = """\
    The config crate converts by the type serde asks for: a string into a number in decimal only \
    (`0x10` and `4x2` fail the load), a float into an integer rounded (4.5 is 5), and never a \
    scalar into a list."""
who = ["operator"]
visible_in = """\
    Startup with a pbs.yaml, pbs.json, pbs.toml or `PBS_` variables whose values are not of the \
    field's type"""
pin = "crates/config/tests/loader.rs::go_difference_weak_typing"
restore = """\
    CONFIG-LOADER ports cast's conversions as Viper's `Get` applies them and mapstructure's weak \
    decode over the Go types of `config.Configuration`, with the account modules hook."""
rule_b = "c"

