[package]
name = "pbs-currency"
description = "Currency rates, conversion and rate fetching matching Prebid Server Go"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
publish.workspace = true
categories.workspace = true

[lints]
workspace = true

# pbs-http-client fetches the currency file (Go's &http.Client{}) and url parses its URL first,
# as http.NewRequestWithContext does; pbs-logger writes the failures; tokio bounds the fetch and
# runs the ticker; bytes and futures-util make the mock transport's response and future.
[dependencies]
bytes = { workspace = true }
futures-util = { workspace = true }
pbs-http-client = { path = "../http-client", version = "0.1.0" }
pbs-logger = { path = "../logger", version = "0.1.0" }
tokio = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
