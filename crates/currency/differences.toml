# pbs-currency's entries in the differences ledger (see the pbs_differences ledger module for the
# schema): where the currency rates fetch, on pbs-http-client, serde and pbs-logger, differs from
# Go's RateConverter on net/http and jsoniter. Each pin compares the crate with a golden written
# by testdata/go.
# After a change run
#   cargo run -p pbs-differences --locked --offline -- --write

[[difference]]
id = "currency.fetch-error-texts"
category = "currency"
status = "ledgered"
title = """\
    Currency fetch errors: net/http's and net/url's words in Go's log lines, reqwest's and the \
    url crate's here"""
go = """\
    A failed fetch logs `Error updating conversion rates: <err>`, and `error draining conversion \
    rates response body: <err>` before it when the body fails (currency/rate_converter.go:49-102), \
    with net/http's words in the errors: `Get \"<url>\": EOF` when the server closes the \
    connection, `Get \"<url>\": dial tcp 127.0.0.1:PORT: connect: connection refused`, `Get \
    \"<url>\": net/http: HTTP/1.x transport connection broken: malformed HTTP response \
    \"garbage\"`, `Get \"ftp://...\": unsupported protocol scheme \"ftp\"`, `unexpected EOF` for \
    a body cut short or a corrupt gzip body, and `read tcp ...: use of closed network connection` \
    for the drain after the deadline; net/url's `parse \"http://[::1\": missing ']' in host`; and \
    `Get \"invalidurl\": unsupported protocol scheme \"\"` for a URL without a scheme, which \
    `url.Parse` takes and `client.Do` refuses."""
rust = """\
    Prebid's words, the `Get \"<url>\"` shape and the deadline's `context deadline exceeded` are \
    Go's, and the words after them are reqwest's chain: `error sending request: client error \
    (SendRequest): connection closed before message completed`, `error sending request: client \
    error (Connect): tcp connect error: Connection refused (os error 61)` on macOS, `error sending \
    request: client error (SendRequest): invalid HTTP version parsed`, `builder error: URL scheme \
    is not allowed`, and `error decoding response body: ...` for the bodies; the drain after the \
    deadline reads `context deadline exceeded`. The url crate refuses the URLs it cannot parse \
    before any request, a URL without a scheme among them, in its own words: `parse \
    \"invalidurl\": relative URL without a base`, `parse \"http://[::1\": invalid IPv6 \
    address`."""
who = ["operator"]
visible_in = "The server's log: the lines of a failed currency rates fetch"
pin = "crates/currency/tests/fetch.rs::error_texts"

[[difference]]
id = "currency.rates-json"
category = "currency"
status = "ledgered"
title = """\
    Currency file decode: what jsoniter reads otherwise than serde in Go's rates file"""
go = """\
    `RateConverter.fetch` decodes the currency file with `jsonutil.UnmarshalValid` into \
    `currency.Rates` (jsoniter, currency/rate_converter.go:81-85), so what every jsoniter decode \
    does applies to it: it reads another case of the member, `{\"Conversions\":...}` \
    (`json.key-case`), decodes a second `conversions` member into the first one's map \
    (`json.duplicate-keys`), reads the document `null` as rates without conversions \
    (`json.null-document`) and a null rate as 0 (`json.null-elements`), reads a rate with a \
    leading plus (`json.plus-float`), a raw control character after an escape or in a member name \
    (`json.control-characters`) and a key's bytes that are not UTF-8 as they came \
    (`json.invalid-utf8`), and stops at a NUL after the document (`json.trailing-nul`); it fails \
    on a skipped number past float64's range, or past float32's where it starts with 0 \
    (`json.out-of-range-numbers`), on nesting past 10000 levels (`json.nesting-depth`) and on an \
    array for the document (`json.struct-from-array`). Beyond those it reads `null` where a key of \
    either map belongs as the key `\"\"` (`{\"conversions\":{\"USD\":{null:1}}}`), and its skipper \
    reads a malformed number that starts with a minus in a member Rates skips (`-01`, `-.5`, \
    `-01e5`, `-00e999999999999`)."""
rust = """\
    serde reads the file into `Rates` through `pbs_jsonutil::unmarshal_valid` with those entries' \
    rules. `json.key-case` and `json.duplicate-keys` apply: a `Conversions` member is skipped, so \
    the fetch stores rates without conversions, on which a conversion fails with `rates are nil`, \
    and a second `conversions` member fails the fetch. A null document, a null rate or key, a \
    leading plus, a raw control character, bytes that are not UTF-8, a NUL after the document and \
    a malformed number in a skipped member fail it too, and the converter logs the failure and \
    keeps the rates it had, or falls back to the constant rates once they are stale. A skipped \
    number past float64's or float32's range, deep nesting in a skipped member and an array for \
    the document, read as the struct's fields (`[{\"USD\":{\"GBP\":1}}]`), decode where Go's fetch \
    fails."""
who = ["operator"]
visible_in = "The conversion rates a server loads from a currency file that spells `conversions` in another case or bends JSON's rules, and the log line of a fetch that fails on one"
pin = "crates/currency/tests/rates.rs::decode_like_go"
