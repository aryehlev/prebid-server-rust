[[difference]]
id = "jsonschema.formats"
category = "jsonschema"
status = "restored"
title = "`format`: gojsonschema's `uuid` and `hostname` checkers, and no other format"
go = """\
    gojsonschema checks 17 formats with its own patterns and Go's parsers (`hostname` is its \
    RFC 1123 pattern under 256 bytes, `uuid` its pattern of lower-case hex groups), fails a \
    number with `Does not match format` and passes every value for a name it has no checker \
    for; the bidder schemas use `uuid` and `hostname`."""
rust = """\
    A JSON Schema crate's checkers follow other readings of the RFCs, so params Go accepts would \
    fail and params Go refuses would pass."""
who = ["publisher"]
visible_in = """\
    Whether a request's bidder params pass a schema with `"format": "uuid"` or `"format": \
    "hostname"`, and the text when they do not"""
pin = "crates/bidder-params/tests/go_golden.rs::formats"
restore = """\
    `uuid` and `hostname` with gojsonschema's patterns through `pbs_util::goregex`, and no check \
    for a name Go has no checker for; a schema with one of the 15 other formats Go checks fails \
    to load (jsonschema.unsupported-keywords)."""
rule_b = "a"
decision = "D-JSONSCHEMA"

[[restoration]]
id = "jsonschema.formats"
pin = "crates/bidder-params/tests/go_golden.rs::formats"
note = """\
    408 documents against `uuid` and `hostname` check as Go's do, with Go's text; the empty \
    name and 4 names Go has no checker for load and check nothing, and the 15 other formats \
    fail to load."""

[[difference]]
id = "jsonschema.number-precision"
category = "jsonschema"
status = "ledgered"
title = "Numbers in params and schemas: Go compares exact rationals, the port `serde_json`'s numbers"
go = """\
    gojsonschema reads numbers as `json.Number` and compares them as `big.Rat`, so \
    `1.0000000000000001` is no integer, `1e400` is a number and a limit prints with all its \
    digits (`0.30000000000000001`); a number whose exponent is beyond `big.Rat`'s limit panics."""
rust = """\
    serde_json holds a number as `i64`, `u64` or `f64`: integers compare exactly, other numbers \
    as `f64`, so a value of more than 15 significant digits may round across a limit or become \
    an integer, `1e400` fails to decode and a limit prints with the `f64`'s shortest digits."""
who = ["publisher"]
visible_in = """\
    Bidder params with a number of more than 15 significant digits, or beyond `f64`'s range, \
    against a schema's `type`, `minimum` or `maximum`"""
pin = "crates/bidder-params/tests/go_adversarial.rs::huge_numbers"
restore = """\
    Read numbers as exact decimals, which needs serde_json's `arbitrary_precision` that the \
    rulings forbid; not planned."""
decision = "D-DECODE"

[[difference]]
id = "jsonschema.decode-errors"
category = "jsonschema"
status = "ledgered"
title = "Params and schemas that are not JSON: `encoding/json`'s texts in Go, `serde_json`'s in the port"
go = """\
    gojsonschema decodes with `encoding/json`'s `Decoder` (`UseNumber`), which fails with its \
    own texts (`EOF`, `unexpected EOF`, `invalid character 'm' looking for beginning of value`) \
    and reads a top-level `01` as `0`; Prebid returns the text as the params' error."""
rust = """\
    serde_json reads the first value too, fails with its texts (`EOF while parsing a value at \
    line 1 column 0`, `expected value at line 1 column 1`) and refuses a leading zero."""
who = ["publisher"]
visible_in = """\
    The error of params that are not JSON, which a request shows only where its decoder accepts \
    bytes `encoding/json` does not: Prebid validates the params the request decoder has read"""
pin = "crates/bidder-params/tests/go_golden.rs::decode_texts_are_serde_jsons"
restore = "Write `encoding/json`'s messages from serde_json's error categories; not planned (D-DECODE)."
decision = "D-DECODE"

[[difference]]
id = "jsonschema.schema-files"
category = "jsonschema"
status = "ledgered"
title = "Opening static/bidder-params: Go loads each schema through a `file://` URL, the port by its path"
go = """\
    `NewBidderParamsValidator` makes each schema's path absolute with `filepath.Abs` \
    (`os.Getwd`, which gives `$PWD` when `$PWD` names the working directory, then \
    `filepath.Clean`, which drops `..`) and compiles it through gojsonschema's reference loader \
    for `"file:///" + path` (openrtb_ext/bidders.go:819-827): `url.Parse` refuses a control \
    character or a bad `%` escape (in the fragment too), a `#` cuts the path and what follows is \
    resolved as a JSON pointer into the file before it, and `url.QueryUnescape` decodes `%XX` \
    and turns `+` into a space, so a directory whose path holds one of them fails to load, or \
    compiles another file when one answers to the decoded name; os's failures read \
    `open <path>: no such file or directory` (`*fs.PathError`)."""
rust = """\
    The port compiles the file at `std::path::absolute`'s path (the working directory from \
    `getcwd`, `..` kept): it loads every such directory, always from the file whose contents \
    `Schema` returns, and std words the failures (`No such file or directory (os error 2)`) \
    inside Prebid's messages, which keep Go's words."""
who = ["operator"]
visible_in = """\
    Startup from a working directory whose path holds `+`, `%`, `#` or a control character, where \
    Go fails to start (or compiles the file another name decodes to) and the port starts, and \
    the path and file error in the fatal error of a static/bidder-params that does not load"""
pin = "crates/bidder-params/tests/go_loader.rs::schema_files_open_by_path"
restore = """\
    Port `net/url`'s parse, fragment and unescape rules, gojsonschema's JSON pointers, \
    `os.Getwd` and Go's errno texts; not planned: the schema path is no config key, Go's \
    refusals keep no operator's deployment working, and orchestrator ruling 2 ledgers library \
    error wording."""
note = """\
    The 28 cases of testdata/golden/loader.jsonl (`go_loader.rs::go_opens_a_file_url` reads Go's \
    side off it) cover each character, a bad escape after a `#` and after multi-byte text, a \
    schema file answering to the decoded name, `..`, `$PWD` (in a child process, so no test \
    changes the working directory or the environment) and the failures os reports; and, where \
    the port is Go, files that fail in the order of their names, a file without `.json` and an \
    alias's own schema file, which gives way to its parent's schema, an absent one too."""

[[difference]]
id = "jsonschema.unsupported-keywords"
category = "jsonschema"
status = "ledgered"
title = "Keywords no Prebid schema uses: gojsonschema reads them, the port fails the schema's load"
go = """\
    gojsonschema reads every keyword of drafts 4, 6 and 7 (`$ref`, `definitions`, `multipleOf`, \
    `patternProperties`, `const`, the tuple form of `items`, boolean schemas and the rest), 17 \
    formats and any pattern Go's `regexp` compiles."""
rust = """\
    `Schema::new` fails, naming the keyword, format or form, for a schema that uses one the port \
    does not read, and for a pattern `pbs_util::goregex` does not translate \
    (regex.syntax-edges)."""
who = ["operator"]
visible_in = """\
    Startup with a bidder-params schema, or a rules engine schema, that uses such a keyword: \
    none of the 282 schemas of static/bidder-params and rules-engine-schema.json does"""
pin = "crates/bidder-params/src/gojsonschema/schema.rs::unread_keywords_are_refused"
restore = """\
    Port a keyword, with Go goldens, when a Prebid schema needs it (D-JSONSCHEMA); not planned \
    until then."""
decision = "D-JSONSCHEMA"
