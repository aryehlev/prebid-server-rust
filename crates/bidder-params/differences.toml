pin = "crates/bidder-params/tests/go_golden.rs::texts_exact"
note = """\
    16,079 documents of one member per object, over the 283 schemas Prebid loads, give Go's \
    joined text byte for byte."""

[[restoration]]
id = "jsonschema.error-texts"
