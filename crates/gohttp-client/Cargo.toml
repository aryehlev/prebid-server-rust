[package]
name = "pbs-gohttp-client"
description = "Go net/http client and transport wire behaviour"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
publish.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
flate2 = { workspace = true }
pbs-gocompat = { path = "../gocompat", version = "0.1.0" }
pbs-util = { path = "../util", version = "0.1.0" }
rustls = { workspace = true, features = ["prefer-post-quantum", "tls12"] }
socket2 = { workspace = true, features = ["all"] }
tokio = { workspace = true }
tokio-rustls = { workspace = true, features = ["tls12"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
