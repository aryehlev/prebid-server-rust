    pbs-server's port of `parseCoding` reads it with std's `str::parse::<f64>` (Rule A), which \
    refuses hexadecimal and `_` (the item is dropped), reads `+nan` and `-nan` as NaN (the item \
    stays, and its q is not above 0) and a number beyond the largest float as infinity (clamped to \
    1 or 0). Every other q, `inf`, `infinity`, `nan` and numbers that underflow to 0 included, is \
    read alike. Of the golden's 1,679 values, 102 get another answer, all synthetic."""
