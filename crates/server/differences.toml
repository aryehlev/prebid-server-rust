# pbs-server's differences from Go (see the pbs_differences ledger module for the schema):
# server/server.go's listeners on hyper-util and axum where Go has net/http's server, and its
# gzip on tower-http where Go has gziphandler v1.1.1, each pinned in tests/ against what Go's
# servers answered. The restored entries are the settings that keep Go's behaviour; the
# [[restoration]] tables give their restore pins. pbs-differences validates this file and writes
# docs/DIFFERENCES.md and docs/differences.json from every fragment.

[[difference]]
id = "server.header-order"
category = "server"
status = "ledgered"
title = """\
    Response header order: net/http sorts the handler's headers by name, hyper keeps the order \
    they were set in"""
go = """\
    net/http writes the handler's header fields sorted by name (`Header.writeSubset` over \
    `sortedKeyValues`, net/http/header.go:179-190), then `Date`, `Content-Length` and \
    `Connection` (`chunkWriter.writeHeader`, net/http/server.go:1258)."""
rust = """\
    hyper writes them in the order the handler set them, then `content-length`, `connection` and \
    `date`."""
who = ["publisher"]
visible_in = "The header block of every response"
pin = "crates/server/tests/wire.rs::header_order"

[[difference.harness]]
kind = "wire"
lexical_class = "header_order"
path = "$['@headers'].**"

[[difference]]
id = "server.header-case"
category = "server"
status = "ledgered"
title = "Response header names: net/http writes them canonical, hyper in lower case"
go = """\
    net/http writes canonical names (`Content-Type`), as `Header.Set` and `Header.Add` store them \
    (`textproto.CanonicalMIMEHeaderKey`)."""
rust = "hyper writes every name in lower case (`content-type`); ignoring case, the names are the same."
who = ["publisher"]
visible_in = "The header names of every response"
pin = "crates/server/tests/wire.rs::lower_case_names"
restore = """\
    hyper's `title_case_headers`, one line of pbs-server's connection builder; not planned \
    (D-HDRCASE)."""
decision = "D-HDRCASE"

[[difference.harness]]
kind = "wire"
lexical_class = "header_case"
path = "$['@headers'].**"

[[difference]]
id = "server.framing"
category = "server"
status = "ledgered"
title = """\
    Response framing: net/http chunks long bodies and leaves some unframed, hyper sends a length \
    for every full body"""
go = """\
    net/http gives an answer whose handler wrote at most 2,048 bytes a `Content-Length` and \
    chunks a longer one (`bufferBeforeChunkingSize`, net/http/server.go:341); over HTTP/1.0 a \
    longer answer is unframed and the closed connection ends it, a HEAD answer gets no length \
    unless the handler's bytes fit the buffer, and a gzip answer whose compressed bytes fit it \
    gets their length."""
rust = """\
    hyper sends `content-length` for every full body, over HTTP/1.0 and to HEAD too. pbs-server's \
    gzip layer compresses a body whole, so a gzip answer gets the length of its compressed bytes \
    however long they are, a HEAD answer that of its GET body's compression; a stream it sends on \
    uncompressed keeps the handler's framing (`server.gzip-streams`)."""
who = ["publisher"]
visible_in = """\
    The framing of answers longer than 2,048 bytes, of HTTP/1.0 and HEAD answers, and of gzip \
    answers"""
pin = "crates/server/tests/wire.rs::content_length_always"

[[difference.harness]]
kind = "wire"
lexical_class = "framing"
path = "$['@headers'].**"

[[difference]]
id = "server.content-sniffing"
category = "server"
status = "ledgered"
title = "Answers without a type: net/http sniffs one, a Rust handler's response type sets it"
go = """\
    net/http sniffs the `Content-Type` of an answer whose handler set none \
    (`http.DetectContentType` on its first bytes, net/http/server.go:1456): JSON and plain text get \
    `text/plain; charset=utf-8`, HTML `text/html; charset=utf-8`, XML `text/xml; charset=utf-8`, \
    other bytes `application/octet-stream`, and an empty answer none. With gzip on, gziphandler \
    sniffs the bytes of an answer it compresses the same way (gzip.go:129-131)."""
rust = """\
    Nothing is sniffed: the response type sets the type (`String` `text/plain; charset=utf-8`, \
    `Json` `application/json`, bytes `application/octet-stream`, empty bytes included). A type \
    the handler sets is sent as set on both."""
who = ["publisher"]
visible_in = """\
    The `Content-Type` of answers whose Go handler sets none; an endpoint that sets the type Go's \
    sniffing gives (Prebid logic) answers alike"""
pin = "crates/server/tests/wire.rs::no_generic_sniffing"

[[difference]]
id = "server.max-header-bytes"
category = "server"
status = "restored"
title = """\
    Request head size: net/http reads heads up to 1 MiB + 4,096 bytes, hyper's default buffer up \
    to 408 KiB"""
go = """\
    Prebid's servers set no `MaxHeaderBytes` (server/server.go:90-118), so net/http reads a \
    request head up to `DefaultMaxHeaderBytes`, 1 MiB, plus 4,096 bytes of slack \
    (net/http/server.go:895-906): a 600 KiB or 1 MiB head is served, and a longer one gets 431."""
rust = """\
    hyper's default read buffer, 408 KiB (`8192 + 4096 * 100` bytes), refuses the 600 KiB and \
    1 MiB heads with 431."""
who = ["publisher"]
visible_in = "Requests with large heads: long cookies, referers or query strings"
pin = "crates/server/tests/wire.rs::header_limit_like_go"
restore = """\
    pbs-server's connection builder sets hyper's `max_buf_size` to 1 MiB + 4,096 bytes \
    (crates/server/src/serve/limits.rs), so the heads Go serves are served and longer ones get \
    431. The 431's form is `server.bad-requests`, and a head whose last read crosses the limit is \
    `server.header-limit-edge`."""
rule_b = "a"

[[restoration]]
id = "server.max-header-bytes"
pin = "crates/server/tests/wire.rs::header_limit_like_go"
note = """\
    The wire golden's 600 KiB, 1 MiB and at-limit heads get 200 on pbs-server as on net/http, and \
    its paced heads past the limit 431."""

[[difference]]
id = "server.header-limit-edge"
category = "server"
status = "ledgered"
title = """\
    A head just over the limit: net/http counts every byte, hyper serves one that ends in the read \
    that crosses the limit"""
go = """\
    net/http limits the connection's reader to 1 MiB + 4,096 bytes (`setReadLimit`), so a head \
    one byte over gets 431 however its bytes arrive."""
rust = """\
    hyper parses what it has read before it checks the buffer's size, so a head over the limit \
    whose last bytes arrive in the read that crosses it is served."""
who = ["publisher"]
visible_in = "Requests whose heads end just past 1 MiB + 4,096 bytes"
pin = "crates/server/tests/wire.rs::header_limit_edge_differs"

[[difference]]
id = "server.header-count"
category = "server"
status = "ledgered"
title = "Header fields per request: net/http reads any number, hyper at most 100"
go = """\
    net/http bounds a request head by its bytes only (`textproto.Reader.ReadMIMEHeader` reads any \
    number of fields), so heads with 101 or 1,000 fields are served."""
rust = """\
    hyper refuses a request with more than 100 header fields, `Host` and `Connection` counted, \
    with 431."""
who = ["publisher"]
visible_in = "Requests with more than 100 header fields"
pin = "crates/server/tests/wire.rs::header_count_limit"
restore = """\
    A higher `max_headers` on pbs-server's connection builder, which moves hyper's header array \
    from the stack to a heap allocation per request; not planned, an orchestrator decision."""

[[difference]]
id = "server.long-request-target"
category = "server"
status = "ledgered"
title = """\
    Long request targets: net/http takes any the head limit allows, hyper refuses one over 65,534 \
    bytes"""
go = """\
    net/http reads the request line within the head limit (`readRequest`, net/http/request.go), \
    so targets of 65,535 and 100,000 bytes are served."""
rust = """\
    hyper refuses a request target longer than 65,534 bytes with 414 `URI Too Long`; it has no \
    setting for the limit."""
who = ["publisher"]
visible_in = "Requests whose path and query are longer than 65,534 bytes"
pin = "crates/server/tests/wire.rs::long_request_target"

[[difference]]
id = "server.request-target"
category = "server"
status = "ledgered"
title = """\
    Request-target bytes: net/http routes any target without control bytes, the http crate \
    refuses some with 400 and drops what follows `#`"""
go = """\
    net/http parses the target with `url.ParseRequestURI` (`readRequest`, \
    net/http/request.go:1123), which refuses only control bytes (net/url/url.go:435): `"`, `<`, \
    `>` and the backquote in the path or the query, and bytes that are not UTF-8, reach the \
    router, and a `#` stays in `URL.Path` (`/echo#x` matches no route) or in `URL.RawQuery` \
    (`n=1#0` gives `n` the value `1#0`)."""
rust = """\
    hyper builds the request's `http::Uri` before any service runs, and the http crate's scanner \
    (`scan_path_and_query` and its byte tables, http 1.5.0 src/uri/path.rs:418-538) refuses `<`, \
    `>` and the backquote in the path, `"`, `<` and `>` in the query, and bytes that are not \
    UTF-8, with 400 (`server.bad-requests`); it drops a `#` and what follows it, so `/echo#x` is \
    `/echo` and `n=1#0` gives `n` the value `1`. `"`, `{` and `}` in the path and the backquote, \
    `{`, `}`, `|`, `^`, `[`, `]` and `\\` in the query are routed on both."""
who = ["publisher"]
visible_in = """\
    Requests whose target holds bytes a browser would have percent-encoded: JSON or markup in a \
    query string, a raw `#`, bytes that are not UTF-8"""
pin = "crates/server/tests/wire.rs::request_target_bytes"
restore = """\
    None in the crates: neither hyper nor the http crate has a setting for the bytes a target may \
    hold, and the `Uri` is built before any layer runs."""

[[difference]]
id = "server.bad-requests"
category = "server"
status = "ledgered"
title = """\
    Malformed requests: net/http answers with its status text and `Connection: close`, hyper with \
    an empty body, and they refuse different requests"""
go = """\
    net/http refuses a request it cannot read before any handler runs, with its status text as \
    the body, `Content-Type: text/plain; charset=utf-8` and `Connection: close` (`conn.serve`, \
    net/http/server.go:2003-2042): 400, some with a reason such as `missing required Host \
    header`, 431 past the head limit, 505 for an unknown version and 501 for an unknown transfer \
    coding. It refuses a request without `Host`, with two, with a malformed one (`Host: a b`) or \
    after a blank line, answers an expectation other than `100-continue` with 417, ignores \
    `Transfer-Encoding` on HTTP/1.0, and serves a folded header line."""
rust = """\
    hyper's refusals have an empty body. It serves a request without `Host`, with two, with a \
    malformed one or after a blank line, and one with any expectation; it refuses a folded \
    header line and an HTTP/1.0 request with `Transfer-Encoding` with 400, and answers 400 where \
    net/http has 505 and 501. A broken chunked body reaches the handler as an error on both, in \
    the library's words. The HTTP/2 preface is `server.h2c` and the bytes of the target \
    `server.request-target`; after a 431 whose client is still sending its head, that client \
    reads the connection's end on net/http and its end or a reset on hyper \
    (`server.lingering-close`)."""
who = ["publisher"]
visible_in = "Answers to malformed HTTP requests"
pin = "crates/server/tests/wire.rs::malformed_request"

[[difference]]
id = "server.h2c"
category = "server"
status = "restored"
title = "HTTP/2 without TLS: net/http serves none, hyper-util's builder as it comes does"
go = """\
    Prebid's servers set no `Protocols` (server/server.go:90-118), so net/http serves no \
    unencrypted HTTP/2: it answers the prior-knowledge preface as a malformed HTTP/1.1 request, \
    with 400, and serves a request asking to upgrade to h2c as HTTP/1.1."""
rust = """\
    hyper-util's connection builder as it comes speaks HTTP/2 to a client that opens with the \
    preface, and answers with its SETTINGS frame."""
who = ["publisher"]
visible_in = "Connections that open with the HTTP/2 preface over plain TCP"
pin = "crates/server/tests/wire.rs::no_h2c"
restore = """\
    pbs-server's connection builder is HTTP/1.1 only (`http1_only`, crate configuration, no \
    glue): it serves the upgrade request as HTTP/1.1, and closes a connection at the preface \
    without an answer, where net/http writes its 400."""
rule_b = "prebid-logic"

[[restoration]]
id = "server.h2c"
pin = "crates/server/tests/wire.rs::no_h2c"
note = """\
    The wire golden's upgrade request is served as HTTP/1.1 on pbs-server as on net/http, and the \
    preface gets no HTTP/2 answer."""

[[difference]]
id = "server.timeouts"
category = "server"
status = "ledgered"
title = """\
    Read and write budgets: net/http's `ReadTimeout` and `WriteTimeout`, pbs-server's head, idle \
    and body budgets with no write deadline"""
go = """\
    The main and Unix-socket servers set a 15 s `ReadTimeout` and `WriteTimeout` \
    (server/server.go:103-116), the admin and Prometheus servers neither. `ReadTimeout` is one \
    deadline for the head and the body from the start of the request, and with `IdleTimeout` \
    unset it also ends an idle keep-alive connection; past `WriteTimeout` the handler still runs, \
    but its answer is lost and the connection closes, so the client gets no status."""
rust = """\
    The same listeners get a 15 s budget from hyper's header read timeout, which bounds the head \
    and the idle wait, and from tower-http's request-body timeout, which bounds each wait between \
    body reads, so a body trickled within the budget is read whole. Nothing bounds the handler \
    (no 408 or 503 `TimeoutLayer`), so a late answer is still sent. The admin listener has no \
    budget, as on Go."""
who = ["operator", "publisher"]
visible_in = """\
    Clients that send slowly, connections left idle, and answers that take longer than 15 s, on \
    the main and Unix-socket listeners"""
pin = "crates/server/tests/wire.rs::timeouts"

[[difference]]
id = "server.unread-body"
category = "server"
status = "ledgered"
title = """\
    Request bodies a handler leaves unread: net/http reads up to 256 KiB of them and keeps the \
    connection, hyper closes it unless one more read ends the body"""
go = """\
    Before it writes the answer, net/http reads and discards what is left of the request body, \
    waiting for it within the read budget, up to `maxPostHandlerReadBytes`, 256 KiB \
    (`chunkWriter.writeHeader`, net/http/server.go:1374-1443), and keeps the connection for the \
    next request; it answers with `Connection: close` when the request asked for \
    `Expect: 100-continue` and its body was not read, or when 256 KiB or more is left, and then \
    waits 500 ms before it closes (`server.lingering-close`)."""
rust = """\
    hyper sends the answer at once, then makes one read of what is left of the body \
    (`poll_drain_or_close_read`, hyper 1.12.0 src/proto/h1/conn.rs:876) and keeps the \
    connection only when that read ends the body, a short rest that has already arrived; \
    otherwise it closes the connection after the answer, without `connection: close`, and a \
    client still sending the body may read a reset (`server.lingering-close`). Both send \
    `100 Continue` to a handler that reads the body."""
who = ["publisher", "operator"]
visible_in = """\
    Connections whose request carries a body the handler answers without reading (404s, 405s and \
    answers given before the body is read), and the connection counts that follow"""
pin = "crates/server/tests/wire.rs::unread_body"
note = """\
    The auction endpoint discards the rest of a body over `max_request_size` itself so that the \
    connection can be reused (endpoints/openrtb2/auction.go:455-456); that is Prebid logic its \
    port keeps, and a body read to its end keeps the connection on both."""

[[difference]]
id = "server.lingering-close"
category = "server"
status = "ledgered"
title = """\
    Closing on a client still sending: net/http shuts the write side and waits 500 ms before it \
    closes, hyper closes at once"""
go = """\
    After the 431 for a head past the limit, and after an answer that leaves 256 KiB or more of \
    the body unread (`requestBodyLimitHit` or `closedRequestBodyEarly`), `conn.serve` calls \
    `closeWriteAndWait` (net/http/server.go:2007-2016 and 2082-2086): it sends the answer and a \
    FIN, sleeps `rstAvoidanceDelay`, 500 ms, with the read side still open, and only then closes \
    (net/http/server.go:1759-1811). A client still sending reads the whole answer and its end, \
    and its writes are accepted for those 500 ms. Its other refusals (400, 417, 501 and 505) \
    close at once, as hyper does."""
rust = """\
    hyper sends the answer and a FIN and closes the socket at once, so the bytes a client sends \
    after the answer meet a reset: its next writes fail, and a client that has not yet read the \
    end of the answer may read the reset in its place (macOS reports it first). A stack that \
    drops unread data on a reset can lose the answer itself, as net/http's comment on \
    `closeWriteAndWait` warns. Neither hyper nor hyper-util has a setting for a lingering close."""
who = ["publisher"]
visible_in = """\
    Clients that go on sending a request head past 1 MiB + 4,096 bytes after its 431, or a body \
    of which 256 KiB or more is left unread after its answer (a 404 or 405 to a large POST): \
    how their connection ends"""
pin = "crates/server/tests/wire.rs::no_lingering_close"
restore = """\
    A wrapper around each accepted socket whose shutdown hands the socket to a task that reads \
    and discards for 500 ms before it closes, net/http's `closeWriteAndWait`; not planned, since \
    it is none of Rule B's four cases: the request is refused or answered alike on both."""
note = """\
    The golden's `header_over_64kib_paced`, `header_2mib_paced` and `unread_300kib` clients go \
    on writing after the answer and read its end on net/http; on the macOS stack the golden was \
    made on, a reset that came before that read would end them with ECONNRESET, so their end is \
    the 500 ms wait's doing. On pbs-server they read the end or a reset as the timing falls, \
    which `malformed_request` and `unread_body` take as one outcome."""

[[difference]]
id = "server.client-disconnect"
category = "server"
status = "restored"
title = """\
    A client that goes away mid-request: net/http lets the handler finish, hyper as it comes \
    drops it"""
go = """\
    net/http does not stop a handler whose client closed its connection, with a FIN or a reset, \
    and Prebid's handlers run from `context.Background()` (endpoints/openrtb2/auction.go:210), so \
    the auction, its bidder calls, analytics and metrics run to their end."""
rust = """\
    hyper's connection as it comes notices the close and drops the handler at its next await, so \
    the rest of the request's work never runs."""
who = ["publisher", "bidder", "operator", "analytics"]
visible_in = """\
    Requests whose client disconnects before the answer: the bidder calls, events, analytics \
    records and metrics the rest of the handler makes"""
pin = "crates/server/tests/wire.rs::handler_outlives_client"
restore = """\
    pbs-server's connections keep a half-closed connection open (`half_close`, crate \
    configuration, no glue), so the handler runs to its end as on Go."""
rule_b = "prebid-logic"

[[restoration]]
id = "server.client-disconnect"
pin = "crates/server/tests/wire.rs::handler_outlives_client"
note = """\
    The wire golden's handlers whose clients close with a FIN or a reset complete on pbs-server as \
    on net/http."""

[[difference]]
id = "server.body-limit"
category = "server"
status = "restored"
title = """\
    Request body size: net/http sets no limit, axum's `DefaultBodyLimit` refuses bodies over 2 MiB"""
go = """\
    net/http reads request bodies without a limit; the auction, video and vtrack endpoints read at \
    most `max_request_size` themselves and answer with Prebid's text \
    (endpoints/openrtb2/auction.go:440-457, video_auction.go:178, endpoints/events/vtrack.go:88)."""
rust = """\
    `axum::serve` as it comes keeps axum's 2 MiB `DefaultBodyLimit`, so a 3 MiB auction body gets \
    413 `Failed to buffer the request body: length limit exceeded` before the handler runs."""
who = ["publisher", "operator"]
visible_in = "Requests with bodies over 2 MiB where `max_request_size` lets Go's endpoints read them"
pin = "crates/router/tests/routing.rs::no_library_body_limit"
restore = """\
    pbs-server turns `DefaultBodyLimit` off on every router it serves \
    (crates/server/src/serve/limits.rs), and tower-http's `RequestBodyLimitLayer` (413) stays off \
    Prebid's routes, so the endpoints apply the operator's `max_request_size` with Prebid's texts \
    (Rule B (a), and (c) for `max_request_size`)."""
rule_b = "a"

[[restoration]]
id = "server.body-limit"
pin = "crates/router/tests/routing.rs::no_library_body_limit"
note = """\
    A 3 MiB auction body reaches the handler on pbs-server, as the routing golden records it on \
    net/http."""

[[difference]]
id = "server.vary"
category = "server"
status = "restored"
title = """\
    Vary with gzip on: gziphandler adds `Vary: Accept-Encoding` to every answer, tower-http only \
    to answers it would compress"""
go = """\
    With `compression.response.enable_gzip` on, gziphandler adds `Vary: Accept-Encoding` to every \
    answer of the main and Unix-socket servers before the handler runs (gziphandler v1.1.1 \
    gzip.go:324), whatever its size and whether or not the request accepts gzip, so it comes \
    ahead of the Vary values the handler adds."""
rust = """\
    tower-http's compression layer adds `vary: accept-encoding` only to answers it would compress \
    (1,400 bytes or more, not already encoded and not a range), whether or not the request \
    accepts gzip."""
who = ["publisher"]
visible_in = "The Vary header of answers under 1,400 bytes when gzip compression is on"
pin = "crates/server/tests/wire.rs::vary_on_every_answer"
restore = """\
    pbs-server's gzip layer over fastgzip (crates/server/src/compression, D-FASTGZIP) puts \
    `Vary: Accept-Encoding` on every answer, ahead of the Vary values the handler added. The CORS \
    middleware's own Vary line is `server.cors-actual-requests`."""
decision = "D-FASTGZIP"

[[restoration]]
id = "server.vary"
pin = "crates/server/tests/wire.rs::vary_on_every_answer"
note = """\
    The wire golden's gzip answers, compressed or not, to requests with and without \
    `Accept-Encoding: gzip`, GET and HEAD, carry Go's Vary on pbs-server, with Go's status and \
    Content-Encoding, and bodies that gunzip to Go's."""

[[restoration]]
id = "server.vary"
pin = "crates/server/src/compression/tests.rs::writer_decisions_like_go"
note = """\
    The 452 `gzip` rows of the golden with Prebid's options whose plan an axum answer stands for, \
    over seven Accept-Encoding values, get gziphandler's status, Content-Encoding, Content-Length \
    and Vary from the layer, and bodies that are Go's or gunzip to the handler's bytes."""

[[difference]]
id = "server.shutdown-new-connections"
category = "server"
status = "ledgered"
title = """\
    Graceful shutdown: net/http drops a first request still arriving and keeps a silent \
    connection up to 5 s, hyper serves the one and closes the other"""
go = """\
    `shutdownAfterSignals` stops each server with `Server.Shutdown` and a 10 s deadline \
    (server/server.go:196-207): the listener and idle connections close, and running and \
    pipelined requests are answered with `Connection: close`, as on hyper. A first request whose \
    head was still arriving is read and dropped without an answer (`conn.serve`'s `shuttingDown` \
    check, net/http/server.go:2000), and a connection that has sent nothing is kept until it is \
    5 s old (`closeIdleConns`, net/http/server.go:3207-3212)."""
rust = """\
    hyper's graceful shutdown serves a first head that was arriving, with `connection: close`, \
    and closes a connection that has sent nothing at once."""
who = ["publisher", "operator"]
visible_in = "Connections on their first request when the server stops on SIGTERM or SIGINT"
pin = "crates/server/tests/wire.rs::shutdown_new_connections"

[[difference]]
id = "server.gzip-negotiation"
category = "server"
status = "restored"
title = """\
    Which Accept-Encoding values get gzip: gziphandler's parser and tower-http's RFC 9110 reading \
    disagreed on 542 of the golden's first 1,556 values"""
go = """\
    gziphandler compresses when its own parser gives gzip a q above 0 (`acceptsGzip`, gziphandler \
    v1.1.1 gzip.go:450-453, over `parseEncodings` and `parseCoding`, gzip.go:483-532): it trims \
    Unicode spaces and lower-cases Unicode (`gzİp` is gzip), ignores `x-gzip` and `identity`, \
    keeps the last q of a repeated gzip and of repeated parameters, reads q with `ParseFloat`'s \
    syntax clamped to 0 to 1, and ignores `Q=` and other parameters."""
rust = """\
    tower-http reads the header with RFC 9110's grammar: a value with a byte outside visible \
    ASCII and tab is ignored whole, `x-gzip` is gzip, a repeated gzip takes its best q, a coding \
    with a parameter that is not one strict q-value is dropped, and identity is preferred to a \
    gzip of lower q. Of the golden's values, 456 get gzip from gziphandler only and 86 from \
    tower-http only; the 345 values with none of those features never differ."""
who = ["publisher"]
visible_in = """\
    Whether answers of 1,400 bytes or more are gzipped for requests with unusual Accept-Encoding \
    values, when gzip compression is on"""
pin = "crates/server/tests/compression.rs::gzip_negotiation"
restore = """\
    pbs-server reads the first Accept-Encoding value with a port of `parseEncodings` and \
