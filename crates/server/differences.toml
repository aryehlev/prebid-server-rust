[[difference]]
id = "server.gzip-bytes"
category = "server"
status = "ledgered"
title = "Gzip answers: compress/gzip and fastgzip write different streams of the same body"
go = """\
    gziphandler compresses at `gzip.DefaultCompression` through compress/gzip (gziphandler v1.1.1 \
    gzip.go:443-446, from `startGzip`, gzip.go:150): a header with XFL 0, Go's deflate stream and \
    its trailer."""
rust = """\
    pbs-server's gzip layer compresses through fastgzip at level 0, its default (D-FASTGZIP), with \
    one compressor per kind of payload (JSON, other text, the rest) on each worker thread. The \
    answers of a compressor share their Huffman codes, so an answer's bytes also depend on the \
    answers compressed before it on that thread: the same answer twice, or a HEAD and its GET, \
    can get other bytes and another length. The header says XFL 4 where compress/gzip's says \
    0, the deflate stream is another, of another length, and it is sent with a `content-length` \
    (`server.framing`). Both gunzip to the handler's bytes, with the same trailer, and the same \
    answers are compressed, with the same status, encoding, type and Vary."""
who = ["publisher"]
visible_in = "The bytes and length of gzip-compressed answers"
pin = "crates/server/tests/compression.rs::gzip_bytes"

