[package]
name = "pbs-server"
description = "Prebid Server's listeners on axum, hyper-util and tower-http, and gziphandler's compression on fastgzip: server/server.go's budgets, header limit, gzip and graceful shutdown, with the differences from net/http pinned against Go goldens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
publish.workspace = true
categories.workspace = true

[lints]
workspace = true

# hyper-util's graceful shutdown and its adapter from the router's tower service to hyper's;
# fastgzip for the gzip answers, and futures-util to send on a streamed body it does not compress.
[dependencies]
axum = { workspace = true }
fastgzip = { workspace = true }
futures-util = { workspace = true }
hyper-util = { workspace = true, features = ["server-graceful", "service"] }
tokio = { workspace = true }
tower-http = { workspace = true }

# The wire pins read Go's goldens, check CRC-32s and gunzip with flate2, and serve /static with
# tower-http's ServeDir behind pbs-router's middleware, as ROUTER-MAIN will.
[dev-dependencies]
flate2 = { workspace = true }
pbs-router = { path = "../router", version = "0.1.0" }
serde_json = { workspace = true }
