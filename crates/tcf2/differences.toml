# The differences ledger's entries for pbs-tcf2 (see the pbs_differences ledger module for the
# schema). pbs-differences validates this file and writes docs/DIFFERENCES.md and
# docs/differences.json from it; run
#   cargo run -p pbs-differences --locked --offline -- --write
# after a change.

[[difference]]
id = "gvl.json-leniency"
category = "gvl"
status = "ledgered"
title = "Global vendor lists: Go reads them with `encoding/json`, the port with serde"
go = """\
    go-gdpr's `vendorlist2.ParseEagerly` reads a fetched list with `json.Unmarshal` into its \
    contract: member names match ignoring case (`ſ` and the Kelvin sign as `s` and `k`), a \
    repeated member is read again (a second `vendors` adds its vendors), a string where a list of \
    ids belongs is decoded as standard base64 (`\"purposes\":\"AQID\"` is 1, 2 and 3), a key that \
    is not UTF-8 or holds a lone surrogate escape reads with U+FFFD, a skipped member nested past \
    10000 levels and an array where an object of the contract belongs are refused, and the \
    errors are `encoding/json`'s (`invalid character 'm' looking for beginning of value`)."""
rust = """\
    serde_json reads it into the same contract, so the json.* entries apply: member names match \
    exactly (`json.key-case`), and a repeated member (`json.duplicate-keys`), a key that is not \
    UTF-8 (`json.invalid-utf8`) or holds a lone surrogate (`json.lone-surrogates`) and a string \
    where a list of ids belongs are refused; a skipped member is read at any depth \
    (`json.nesting-depth`); an array of a contract's members, in their order, is read as the \
    contract; and the errors are serde_json's (`expected value at line 1 column 1`). A `null` \
    leaves Go's zero value, and IAB's lists are well-formed: every GVL fixture of go-gdpr and \
    prebid-server reads as in Go."""
who = ["operator"]
visible_in = """\
    Whether a fetched vendor list is kept for GDPR enforcement, and the error of the `GET ... \
    returned malformed JSON` log line (gdpr/vendorlist-fetching.go:150-154)"""
pin = "crates/tcf2/tests/vendorlist.rs::gvl_fixtures"
restore = """\
    A Go-compatible JSON reader for the vendor list; not planned (orchestrator ruling 2), since \
    IAB publishes well-formed lists."""
note = """\
    `crates/tcf2/tests/vendorlist.rs::gvl_corpus` counts, per reason, how the 5,017 documents of \
    the two Go corpora read beside Go. Reading the list through JSONUTIL's decode entry for \
    outside bytes, once it merges (orchestrator ruling 7), would restore keys with a lone \
    surrogate."""
